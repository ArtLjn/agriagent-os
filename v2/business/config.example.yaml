# Business MCP Server 配置模板（不含真实密钥）。
# 复制为 config.yaml 后填入真实值。

server:
  host: "127.0.0.1"
  port: 9876
  mcp_path: "/mcp"

database:
  url: "mysql+pymysql://USER:PASSWORD@HOST:3306/farm_manager?charset=utf8mb4"
  pool_size: 5
  max_overflow: 10
  pool_recycle: 1800
  echo: false

secrets:
  qweather_api_key: ""
  searchhub_base_url: ""
  searchhub_api_key: ""

# 生产环境必须通过 JWT_SECRET 注入，不要使用空值或提交真实密钥。
auth:
  jwt_secret: ""
  jwt_algorithm: "HS256"
  jwt_expire_minutes: 10080
  bcrypt_rounds: 12
  agent_service_token: ""

weather:
  latitude: 34.26
  longitude: 117.18
