[project]
name = "farm-manager-business"
version = "0.1.0"
description = "farm-manager business service exposed as MCP Server"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=3.4",
    "httpx>=0.27",
    "sqlalchemy>=2.0",
    "pymysql>=1.1",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["business"]

# Run: uv run --package farm-manager-business python -m business.server
