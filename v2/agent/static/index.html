<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>farm-manager agent</title>
<style>
  :root {
    --bg: #0f1115;
    --surface: #171a21;
    --surface-2: #1e222b;
    --surface-3: #252a35;
    --border: #2a2f3a;
    --text: #e4e6eb;
    --text-dim: #8b90a0;
    --text-muted: #5a6070;
    --primary: #4f8cff;
    --primary-hover: #3d7ae0;
    --success: #34d399;
    --success-bg: rgba(52, 211, 153, 0.12);
    --warning: #fbbf24;
    --warning-bg: rgba(251, 191, 36, 0.12);
    --danger: #f87171;
    --danger-bg: rgba(248, 113, 113, 0.12);
    --info: #60a5fa;
    --info-bg: rgba(96, 165, 250, 0.12);
    --purple: #a78bfa;
    --purple-bg: rgba(167, 139, 250, 0.12);
    --radius: 12px;
    --radius-sm: 8px;
    --shadow: 0 4px 24px rgba(0,0,0,0.3);
    --transition: 150ms ease;
    --sidebar-w: 280px;
    --trace-w: 420px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI",
                 "PingFang SC", "Helvetica Neue", Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }

  /* ─── App Layout ─────────────────────────────────────────── */

  .app {
    display: flex;
    flex: 1;
    overflow: hidden;
  }

  /* ─── Left Sidebar ──────────────────────────────────────── */

  .sidebar {
    width: var(--sidebar-w);
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
  }

  .sidebar-header {
    padding: 14px 16px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
  }

  .sidebar-header h2 {
    font-size: 12px;
    font-weight: 600;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.8px;
  }

  .btn-icon {
    background: var(--surface-2);
    color: var(--text-dim);
    border: 1px solid var(--border);
    width: 28px;
    height: 28px;
    border-radius: var(--radius-sm);
    font-size: 14px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all var(--transition);
  }
  .btn-icon:hover {
    background: var(--primary);
    color: #fff;
    border-color: var(--primary);
  }

  .conv-list {
    flex: 1;
    overflow-y: auto;
    padding: 8px;
  }
  .conv-list::-webkit-scrollbar { width: 4px; }
  .conv-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .conv-item {
    padding: 10px 12px;
    border-radius: var(--radius-sm);
    cursor: pointer;
    margin-bottom: 4px;
    border: 1px solid transparent;
    transition: all var(--transition);
  }
  .conv-item:hover {
    background: var(--surface-2);
    border-color: var(--border);
  }
  .conv-item.active {
    background: var(--info-bg);
    border-color: rgba(96, 165, 250, 0.3);
  }

  .conv-item-id {
    font-size: 12px;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 3px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .conv-item-preview {
    font-size: 12px;
    color: var(--text-dim);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .conv-item-meta {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 4px;
    font-size: 11px;
    color: var(--text-muted);
  }
  .conv-badge {
    background: var(--surface-3);
    padding: 1px 6px;
    border-radius: 10px;
    font-size: 10px;
  }

  .conv-empty {
    text-align: center;
    padding: 40px 20px;
    color: var(--text-muted);
    font-size: 13px;
  }

  .conv-more {
    padding: 8px;
    text-align: center;
    border-top: 1px solid var(--border);
    flex-shrink: 0;
  }
  .conv-more button {
    background: transparent;
    color: var(--text-dim);
    border: 1px solid var(--border);
    padding: 6px 12px;
    border-radius: var(--radius-sm);
    font-size: 12px;
    cursor: pointer;
    transition: all var(--transition);
  }
  .conv-more button:hover {
    color: var(--text);
    background: var(--surface-2);
  }

  /* ─── Main Chat Area ────────────────────────────────────── */

  .chat-area {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
  }

  .chat-header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 12px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
  }

  .chat-header-left {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .chat-title {
    font-size: 14px;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .chat-title .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--success);
    box-shadow: 0 0 8px var(--success);
  }

  .chat-header-actions {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .user-select {
    background: var(--surface-2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 6px 10px;
    font-size: 12px;
    cursor: pointer;
    outline: none;
    transition: border-color var(--transition);
    max-width: 160px;
  }
  .user-select:hover { border-color: var(--text-muted); }
  .user-select:focus { border-color: var(--primary); }
  .user-select option { background: var(--surface); color: var(--text); }

  .turn-status {
    font-size: 13px;
    color: var(--text-dim);
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .auth-status {
    max-width: 360px;
    padding: 3px 8px;
    border: 1px solid var(--border);
    border-radius: 999px;
    color: var(--text-muted);
    font-size: 11px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .auth-status.ok {
    color: var(--success);
    border-color: rgba(52, 211, 153, 0.35);
    background: var(--success-bg);
  }
  .auth-status.warn {
    color: var(--warning);
    border-color: rgba(251, 191, 36, 0.35);
    background: var(--warning-bg);
  }
  .auth-status.error {
    color: var(--danger);
    border-color: rgba(248, 113, 113, 0.35);
    background: var(--danger-bg);
  }

  .btn {
    background: var(--surface-2);
    color: var(--text-dim);
    border: 1px solid var(--border);
    padding: 6px 14px;
    border-radius: var(--radius-sm);
    font-size: 12px;
    cursor: pointer;
    transition: all var(--transition);
    min-height: 32px;
  }
  .btn:hover {
    background: var(--border);
    color: var(--text);
  }
  .btn.active {
    background: var(--primary);
    color: #fff;
    border-color: var(--primary);
  }
  .btn-primary {
    background: var(--primary);
    color: #fff;
    border: none;
  }
  .btn-primary:hover:not(:disabled) {
    background: var(--primary-hover);
  }

  .chat-main {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    scroll-behavior: smooth;
  }
  .chat-main::-webkit-scrollbar { width: 6px; }
  .chat-main::-webkit-scrollbar-track { background: transparent; }
  .chat-main::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  .chat-empty {
    text-align: center;
    padding: 80px 40px;
    color: var(--text-muted);
  }
  .chat-empty h3 {
    font-size: 18px;
    font-weight: 600;
    color: var(--text-dim);
    margin-bottom: 8px;
  }
  .chat-empty p {
    font-size: 14px;
  }

  .chat-input-bar {
    background: var(--surface);
    border-top: 1px solid var(--border);
    padding: 12px 20px;
    display: flex;
    gap: 10px;
    flex-shrink: 0;
  }
  .chat-input-bar input {
    flex: 1;
    padding: 11px 16px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    font-size: 14px;
    outline: none;
    color: var(--text);
    transition: border-color var(--transition);
  }
  .chat-input-bar input::placeholder { color: var(--text-muted); }
  .chat-input-bar input:focus { border-color: var(--primary); }
  .chat-input-bar button {
    background: var(--primary);
    color: #fff;
    border: none;
    padding: 0 24px;
    border-radius: var(--radius);
    font-size: 14px;
    cursor: pointer;
    font-weight: 600;
    transition: all var(--transition);
    min-height: 44px;
  }
  .chat-input-bar button:hover:not(:disabled) {
    background: var(--primary-hover);
    transform: translateY(-1px);
  }
  .chat-input-bar button:disabled {
    background: var(--surface-2);
    color: var(--text-muted);
    cursor: not-allowed;
  }

  /* ─── Trace Panel (Right Drawer) ────────────────────────── */

  .trace-panel {
    width: 0;
    background: var(--surface);
    border-left: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
    overflow: hidden;
    transition: width var(--transition);
  }
  .trace-panel.open {
    width: var(--trace-w);
  }

  .trace-header {
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
  }
  .trace-header h3 {
    font-size: 13px;
    font-weight: 600;
    color: var(--text-dim);
  }
  .trace-header-actions {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .trace-tabs {
    display: flex;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .trace-tab {
    flex: 1;
    padding: 10px;
    background: transparent;
    border: none;
    color: var(--text-muted);
    font-size: 12px;
    cursor: pointer;
    border-bottom: 2px solid transparent;
    transition: all var(--transition);
  }
  .trace-tab.active {
    color: var(--text);
    border-bottom-color: var(--primary);
  }

  .trace-body {
    flex: 1;
    overflow-y: auto;
    padding: 12px;
  }
  .trace-body::-webkit-scrollbar { width: 4px; }
  .trace-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .trace-empty {
    text-align: center;
    padding: 40px 20px;
    color: var(--text-muted);
    font-size: 13px;
  }

  .trace-request-item {
    padding: 10px 12px;
    border-radius: var(--radius-sm);
    cursor: pointer;
    margin-bottom: 6px;
    border: 1px solid var(--border);
    background: var(--surface-2);
    transition: all var(--transition);
  }
  .trace-request-item:hover {
    border-color: var(--text-muted);
  }
  .trace-request-item.active {
    border-color: var(--primary);
    background: var(--info-bg);
  }

  .trace-req-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 4px;
  }
  .trace-req-id {
    font-family: "SF Mono", Menlo, monospace;
    font-size: 11px;
    color: var(--text-dim);
  }
  .trace-req-status {
    font-size: 10px;
    padding: 1px 8px;
    border-radius: 10px;
    font-weight: 600;
  }
  .trace-req-status.success { background: var(--success-bg); color: var(--success); }
  .trace-req-status.failed { background: var(--danger-bg); color: var(--danger); }
  .trace-req-status.blocked { background: var(--warning-bg); color: var(--warning); }

  .trace-req-meta {
    display: flex;
    gap: 12px;
    font-size: 11px;
    color: var(--text-muted);
  }

  /* Trace Detail View */
  .trace-detail-header {
    padding: 12px;
    background: var(--surface-2);
    border-radius: var(--radius-sm);
    margin-bottom: 12px;
    border: 1px solid var(--border);
  }
  .trace-detail-header h4 {
    font-size: 12px;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 8px;
    font-family: "SF Mono", Menlo, monospace;
    word-break: break-all;
  }
  .trace-summary-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
    font-size: 11px;
  }
  .trace-summary-grid .label { color: var(--text-muted); }
  .trace-summary-grid .value { color: var(--text); font-weight: 600; }

  .trace-node {
    padding: 8px 10px;
    border-radius: var(--radius-sm);
    margin-bottom: 4px;
    border: 1px solid var(--border);
    cursor: pointer;
    transition: all var(--transition);
    background: var(--surface-2);
  }
  .trace-node:hover {
    border-color: var(--text-muted);
  }
  .trace-node.has-error {
    border-color: rgba(248, 113, 113, 0.35);
    background: var(--danger-bg);
  }
  .trace-node.selected {
    border-color: var(--primary);
    background: var(--info-bg);
  }

  .trace-node-row {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
  }
  .trace-node-step {
    background: var(--surface-3);
    padding: 1px 6px;
    border-radius: 4px;
    font-family: "SF Mono", Menlo, monospace;
    font-size: 10px;
    color: var(--text-muted);
    min-width: 20px;
    text-align: center;
  }
  .trace-node-name {
    flex: 1;
    color: var(--text);
    font-weight: 500;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .trace-node-type {
    font-size: 10px;
    padding: 1px 6px;
    border-radius: 10px;
    background: var(--surface-3);
    color: var(--text-muted);
    font-family: "SF Mono", Menlo, monospace;
  }
  .trace-node-dur {
    font-size: 11px;
    color: var(--text-dim);
    font-family: "SF Mono", Menlo, monospace;
    min-width: 40px;
    text-align: right;
  }

  .trace-node-detail {
    margin-top: 8px;
    padding-top: 8px;
    border-top: 1px solid var(--border);
    font-size: 12px;
  }
  .trace-node-detail .detail-label {
    color: var(--text-muted);
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 4px;
  }
  .trace-node-detail pre {
    background: rgba(0,0,0,0.3);
    padding: 8px 10px;
    border-radius: 6px;
    overflow-x: auto;
    font-size: 11px;
    font-family: "SF Mono", Menlo, monospace;
    line-height: 1.5;
    color: var(--text);
    max-height: 200px;
  }

  .trace-breakdown-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 6px 10px;
    border-radius: var(--radius-sm);
    font-size: 12px;
    margin-bottom: 4px;
    background: var(--surface-2);
    border: 1px solid var(--border);
  }
  .trace-breakdown-item .type {
    font-family: "SF Mono", Menlo, monospace;
    color: var(--text);
    font-weight: 500;
  }
  .trace-breakdown-item .stats {
    display: flex;
    gap: 8px;
    font-size: 11px;
    color: var(--text-muted);
  }

  /* ─── Event Cards (existing) ────────────────────────────── */

  .event {
    background: var(--surface);
    border-radius: var(--radius);
    padding: 14px 18px;
    margin-bottom: 10px;
    border: 1px solid var(--border);
    max-width: 100%;
    animation: fadeSlide 0.25s ease-out;
    transition: border-color var(--transition);
  }
  .event:hover { border-color: var(--text-muted); }

  @keyframes fadeSlide {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .event-meta {
    background: transparent;
    border: none;
    padding: 6px 18px;
    max-width: 100%;
    color: var(--text-muted);
    font-size: 12px;
    display: flex;
    gap: 10px;
    align-items: center;
  }
  .event-meta .turn-badge {
    background: var(--surface-2);
    padding: 2px 8px;
    border-radius: 4px;
    font-family: "SF Mono", Menlo, monospace;
    font-size: 11px;
    color: var(--text-dim);
  }

  .event-thought {
    background: var(--surface-2);
    border-color: var(--border);
    color: var(--text-dim);
    font-size: 13px;
    font-style: italic;
  }
  .event-thought .label { color: var(--text-muted); }

  .event-plan {
    background: var(--purple-bg);
    border-color: rgba(167, 139, 250, 0.3);
  }
  .event-plan ol { margin-left: 20px; margin-top: 6px; }
  .event-plan li { margin-bottom: 2px; }

  .event-action {
    background: var(--info-bg);
    border-color: rgba(96, 165, 250, 0.25);
  }

  .event-observation {
    background: var(--success-bg);
    border-color: rgba(52, 211, 153, 0.25);
  }

  .event-approval_required {
    background: var(--warning-bg);
    border-color: rgba(251, 191, 36, 0.35);
    padding: 16px 20px;
  }

  .event-approval_result {
    background: var(--purple-bg);
    border-color: rgba(167, 139, 250, 0.3);
  }

  .event-final_answer_start {
    background: transparent;
    border: none;
    padding: 0;
    max-width: 100%;
    animation: none;
  }

  .event-final_answer {
    background: linear-gradient(135deg, rgba(79, 140, 255, 0.15), rgba(52, 211, 153, 0.1));
    border: 1px solid rgba(79, 140, 255, 0.3);
    color: var(--text);
    font-size: 15px;
    padding: 18px 22px;
    max-width: 100%;
    animation: fadeSlide 0.3s ease-out;
  }
  .event-final_answer .label {
    color: var(--primary);
    font-weight: 600;
    font-size: 11px;
    letter-spacing: 0.8px;
  }

  .assistant-text {
    min-height: 1.5em;
    position: relative;
  }
  .assistant-text .cursor {
    display: inline-block;
    width: 2px;
    height: 1em;
    background: var(--primary);
    margin-left: 2px;
    vertical-align: text-bottom;
    animation: blink 0.6s step-end infinite;
  }
  @keyframes blink {
    50% { opacity: 0; }
  }

  .event-error {
    background: var(--danger-bg);
    border-color: rgba(248, 113, 113, 0.35);
    color: var(--danger);
  }

  .event-context_usage,
  .event-context_compressing,
  .event-context_compressed {
    background: transparent;
    border: none;
    padding: 4px 18px;
    max-width: 100%;
    color: var(--text-muted);
    font-size: 12px;
  }

  .event-doom_loop_warning {
    background: var(--danger-bg);
    border-color: rgba(248, 113, 113, 0.4);
    color: var(--danger);
  }

  .event-verification_warning {
    background: var(--warning-bg);
    border-color: rgba(251, 191, 36, 0.35);
  }

  .event-plan_created {
    background: var(--purple-bg);
    border-color: rgba(167, 139, 250, 0.35);
  }

  .event-plan_step_done {
    background: transparent;
    border: 1px dashed var(--border);
    padding: 6px 14px;
    max-width: 100%;
    font-size: 12px;
    color: var(--text-dim);
  }

  .event-done {
    background: transparent;
    border: none;
    padding: 6px 18px;
    max-width: 100%;
    color: var(--text-muted);
    font-size: 12px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .event-done::before {
    content: "✓";
    color: var(--success);
    font-size: 14px;
  }

  .event .label {
    font-size: 10px;
    font-weight: 600;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.8px;
    margin-bottom: 6px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .event .label .icon { font-size: 12px; }

  .event pre {
    background: rgba(0,0,0,0.3);
    padding: 10px 12px;
    border-radius: var(--radius-sm);
    overflow-x: auto;
    font-size: 12px;
    margin-top: 8px;
    font-family: "SF Mono", Menlo, "Fira Code", monospace;
    line-height: 1.5;
    color: var(--text);
  }

  .json-block { margin-top: 8px; }
  .json-block > pre { margin-top: 0; }
  .json-block > details > summary {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 6px 10px;
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    cursor: pointer;
    font-size: 12px;
    color: var(--text-dim);
    user-select: none;
    transition: background var(--transition);
    list-style: none;
  }
  .json-block > details > summary::-webkit-details-marker { display: none; }
  .json-block > details > summary:hover {
    background: rgba(255,255,255,0.08);
    color: var(--text);
  }
  .json-block > details > summary .chev {
    display: inline-block;
    transition: transform 0.2s ease;
    font-size: 10px;
    color: var(--text-muted);
  }
  .json-block > details[open] > summary .chev { transform: rotate(90deg); }
  .json-block > details > summary .json-label { font-weight: 600; color: var(--text); }
  .json-block > details > summary .json-meta { color: var(--text-muted); font-size: 11px; }
  .json-block > details > pre { margin-top: 6px; }

  .approval-buttons {
    margin-top: 14px;
    display: flex;
    gap: 10px;
  }
  .approval-buttons button {
    padding: 8px 20px;
    border: none;
    border-radius: var(--radius-sm);
    cursor: pointer;
    font-size: 13px;
    font-weight: 600;
    transition: all var(--transition);
    min-height: 36px;
  }
  .btn-approve { background: var(--success); color: #064e3b; }
  .btn-approve:hover:not(:disabled) { background: #10b981; transform: translateY(-1px); }
  .btn-reject { background: var(--danger); color: #450a0a; }
  .btn-reject:hover:not(:disabled) { background: #ef4444; transform: translateY(-1px); }
  .approval-buttons button:disabled {
    opacity: 0.4;
    cursor: not-allowed;
    transform: none;
  }

  .spinner {
    display: inline-block;
    width: 12px;
    height: 12px;
    border: 2px solid var(--border);
    border-top-color: var(--primary);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .tool-result-summary {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
  }
  .tool-result-summary .tool-name {
    font-weight: 600;
    color: var(--info);
    font-family: "SF Mono", Menlo, monospace;
    font-size: 12px;
  }

  .thought-content {
    white-space: pre-wrap;
    word-wrap: break-word;
  }

  .final-content {
    white-space: pre-wrap;
    word-wrap: break-word;
  }

  /* ─── Markdown Styles ─────────────────────────────────── */
  .markdown-body {
    font-size: 15px;
    line-height: 1.7;
    color: var(--text);
    word-wrap: break-word;
  }
  .markdown-body h1, .markdown-body h2, .markdown-body h3, .markdown-body h4 {
    margin-top: 16px;
    margin-bottom: 10px;
    font-weight: 600;
    line-height: 1.3;
  }
  .markdown-body h1 { font-size: 1.4em; border-bottom: 1px solid var(--border); padding-bottom: 6px; }
  .markdown-body h2 { font-size: 1.3em; }
  .markdown-body h3 { font-size: 1.2em; }
  .markdown-body p { margin: 8px 0; }
  .markdown-body ul, .markdown-body ol { padding-left: 24px; margin: 8px 0; }
  .markdown-body li { margin-bottom: 4px; }
  .markdown-body strong { color: var(--text); font-weight: 600; }
  .markdown-body em { color: var(--text-dim); }
  .markdown-body code {
    background: rgba(255,255,255,0.08);
    padding: 2px 6px;
    border-radius: 4px;
    font-family: "SF Mono", Menlo, monospace;
    font-size: 0.9em;
  }
  .markdown-body pre {
    background: rgba(0,0,0,0.4);
    padding: 12px;
    border-radius: 8px;
    overflow-x: auto;
    margin: 10px 0;
    font-family: "SF Mono", Menlo, monospace;
    font-size: 0.85em;
    line-height: 1.5;
  }
  .markdown-body pre code {
    background: transparent;
    padding: 0;
    font-size: inherit;
  }
  .markdown-body blockquote {
    border-left: 3px solid var(--primary);
    padding-left: 14px;
    margin: 10px 0;
    color: var(--text-dim);
    font-style: italic;
  }
  .markdown-body a {
    color: var(--primary);
    text-decoration: none;
  }
  .markdown-body a:hover { text-decoration: underline; }
  .markdown-body table {
    border-collapse: collapse;
    width: 100%;
    margin: 12px 0;
    font-size: 0.9em;
  }
  .markdown-body th, .markdown-body td {
    border: 1px solid var(--border);
    padding: 8px 12px;
    text-align: left;
  }
  .markdown-body th {
    background: var(--surface-2);
    font-weight: 600;
  }
  .markdown-body img { max-width: 100%; border-radius: 8px; }
  .markdown-body hr {
    border: none;
    border-top: 1px solid var(--border);
    margin: 16px 0;
  }

  /* ─── Copy Button ────────────────────────────────────── */
  .copy-btn {
    position: absolute;
    top: 8px;
    right: 8px;
    background: rgba(255,255,255,0.05);
    border: 1px solid var(--border);
    color: var(--text-dim);
    padding: 4px 10px;
    border-radius: 6px;
    font-size: 11px;
    cursor: pointer;
    opacity: 0;
    transition: opacity 0.2s, background 0.2s;
    z-index: 10;
  }
  .event:hover .copy-btn { opacity: 1; }
  .copy-btn:hover {
    background: var(--primary);
    color: #fff;
    border-color: var(--primary);
  }
  .copy-btn.copied {
    background: var(--success);
    color: #064e3b;
    border-color: var(--success);
    opacity: 1;
  }
  .event { position: relative; }

  .hidden { display: none !important; }

  .auth-gate {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: grid;
    place-items: center;
    padding: 24px;
    background: rgba(15, 17, 21, 0.98);
  }
  .auth-card {
    width: min(100%, 380px);
    padding: 28px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
  }
  .auth-card h1 { font-size: 20px; margin-bottom: 8px; }
  .auth-card p { color: var(--text-dim); font-size: 13px; margin-bottom: 22px; }
  .auth-field { display: grid; gap: 6px; margin-top: 14px; }
  .auth-field label { color: var(--text-dim); font-size: 12px; }
  .auth-field input {
    width: 100%;
    padding: 10px 12px;
    color: var(--text);
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    outline: none;
  }
  .auth-field input:focus { border-color: var(--primary); }
  .auth-submit { width: 100%; margin-top: 20px; }
  .auth-error { min-height: 20px; margin-top: 12px; color: var(--danger); font-size: 12px; }

  @media (max-width: 768px) {
    .sidebar { width: 60px; }
    .sidebar .conv-item-preview,
    .sidebar .conv-item-meta,
    .sidebar-header h2 { display: none; }
    .trace-panel.open { width: 100%; position: absolute; right: 0; top: 0; bottom: 0; z-index: 10; }
    .event { max-width: 100%; }
  }
</style>
</head>
<body>
<div class="auth-gate" id="auth-gate">
  <form class="auth-card" id="login-form">
    <h1>Farm Manager Agent</h1>
    <p>登录后访问你的农场会话和 Agent 能力。</p>
    <div class="auth-field">
      <label for="login-phone">手机号</label>
      <input id="login-phone" name="phone" type="tel" inputmode="tel" autocomplete="username" required>
    </div>
    <div class="auth-field">
      <label for="login-password">密码</label>
      <input id="login-password" name="password" type="password" autocomplete="current-password" required>
    </div>
    <button class="btn btn-primary auth-submit" id="login-submit" type="submit">登录</button>
    <div class="auth-error" id="login-error" role="alert"></div>
  </form>
</div>
<div class="app">
  <!-- ─── Left Sidebar: Conversation List ──────────────────── -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <h2>对话列表</h2>
      <button class="btn-icon" id="new-conv-btn" title="新建对话" onclick="newConversation()">+</button>
    </div>
    <div class="conv-list" id="conv-list">
      <div class="conv-empty">
        <div style="font-size:32px;margin-bottom:10px">💬</div>
        暂无对话
      </div>
    </div>
    <div class="conv-more" id="conv-more" style="display:none">
      <button onclick="loadMoreConversations()">加载更多</button>
    </div>
  </aside>

  <!-- ─── Center: Chat ────────────────────────────────────── -->
  <section class="chat-area">
    <div class="chat-header">
      <div class="chat-header-left">
        <div class="chat-title">
          <span class="dot"></span>
          <span id="current-conv-title">选择一个对话</span>
        </div>
        <div class="turn-status" id="turn-status"></div>
        <div class="auth-status" id="auth-status" title="浏览器只持有 User Access Token；Service Token 和 Delegation Token 由 Agent 内部生成并发送给 Business MCP。">鉴权初始化中…</div>
      </div>
      <div class="chat-header-actions">
        <select id="user-select" class="user-select" onchange="selectUser(this.value)" title="切换用户（不同用户看到不同农场数据）">
          <option value="">未选择用户</option>
        </select>
        <button class="btn" onclick="logout()" title="退出登录">退出</button>
        <button class="btn" id="trace-toggle-btn" onclick="toggleTrace()" title="切换 Trace 面板">🔍 Trace</button>
        <button class="btn" onclick="copySessionJson()" title="复制整个会话 JSON（含所有轮次和 skill 调用事件）">📋 复制会话</button>
        <button class="btn" onclick="resetConversation()" title="重置当前对话">🗑 重置</button>
      </div>
    </div>

    <div class="chat-main" id="chat-main">
      <div class="chat-empty" id="chat-empty">
        <h3>开始对话</h3>
        <p>从左侧选择一个对话，或点击 + 创建新对话。</p>
      </div>
    </div>

    <div class="chat-input-bar">
      <input id="msg-input" type="text" placeholder="问点什么…（Enter 发送）"
             onkeydown="if(event.key==='Enter') sendMessage()" autocomplete="off">
      <button id="send-btn" onclick="sendMessage()">发送</button>
    </div>
  </section>

  <!-- ─── Right Drawer: Trace Panel ───────────────────────── -->
  <aside class="trace-panel" id="trace-panel">
    <div class="trace-header">
      <h3>🔍 Trace</h3>
      <div class="trace-header-actions">
        <button class="btn-icon" onclick="refreshTrace()" title="刷新">↻</button>
        <button class="btn-icon" onclick="toggleTrace()" title="关闭">✕</button>
      </div>
    </div>
    <div class="trace-tabs">
      <button class="trace-tab active" data-tab="requests" onclick="switchTraceTab('requests')">请求列表</button>
      <button class="trace-tab" data-tab="detail" onclick="switchTraceTab('detail')">详情</button>
    </div>
    <div class="trace-body" id="trace-body">
      <div class="trace-empty">选择对话后查看 Trace</div>
    </div>
  </aside>
</div>

<script src="/static/marked.min.js"></script>
<script>
// ═══════════════════════════════════════════════════════════
// State
// ═══════════════════════════════════════════════════════════
const state = {
  currentConvId: null,
  convList: [],
  convCursor: null,
  convHasMore: false,
  pendingNewConvId: null,
  tracePanelOpen: false,
  traceTab: 'requests',
  traceRequests: [],
  traceCursor: null,
  traceHasMore: false,
  selectedRequestId: null,
  traceNodes: [],
  traceSummary: null,
  lastRequestId: null,
  currentTurnEvents: [], // 存储当前轮次(turn)的所有事件，用于复制 JSON
  currentTurnUserInput: '', // 存储当前轮次的用户输入
  allTurns: [], // 存储整个会话的所有轮次，用于复制整个 session
  currentUserToken: '', // 当前选中用户的 User Access JWT
  currentUserInfo: null, // {user_id, nickname, phone, role, farm_uid, farm_id}
  devUsers: [], // /dev-users 返回的用户列表
};

// ═══════════════════════════════════════════════════════════
// DOM refs
// ═══════════════════════════════════════════════════════════
const convListEl = document.getElementById('conv-list');
const convMoreEl = document.getElementById('conv-more');
const convTitleEl = document.getElementById('current-conv-title');
const chatMainEl = document.getElementById('chat-main');
const chatEmptyEl = document.getElementById('chat-empty');
const inputEl = document.getElementById('msg-input');
const sendBtn = document.getElementById('send-btn');
const turnStatusEl = document.getElementById('turn-status');
const authStatusEl = document.getElementById('auth-status');
const tracePanelEl = document.getElementById('trace-panel');
const traceBodyEl = document.getElementById('trace-body');
const traceTabEls = document.querySelectorAll('.trace-tab');
const authGateEl = document.getElementById('auth-gate');
const loginFormEl = document.getElementById('login-form');
const loginSubmitEl = document.getElementById('login-submit');
const loginErrorEl = document.getElementById('login-error');

// ═══════════════════════════════════════════════════════════
// Icons
// ═══════════════════════════════════════════════════════════
const ICONS = {
  meta: '●', thought: '💭', plan: '📋', plan_created: '📋', plan_step_done: '▸',
  action: '⚡', observation: '📊', approval_required: '⚠️', approval_result: '✅',
  operation_committed: '✅', write_committed_reply_failed: '⚠️',
  final_answer: '💬', error: '⛔', done: '✓',
  context_usage: '📊', context_compressing: '🗜️', context_compressed: '🗜️',
  doom_loop_warning: '⛔', verification_warning: '⚠️',
};

// ═══════════════════════════════════════════════════════════
// Utility
// ═══════════════════════════════════════════════════════════
function escapeHtml(s) {
  if (s == null) return '';
  return String(s).replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}
function escapeAttr(s) { return escapeHtml(s); }

function setBusy(state) {
  if (state) {
    sendBtn.disabled = true;
    inputEl.disabled = true;
    turnStatusEl.innerHTML = '<span class="spinner"></span>处理中';
  } else {
    sendBtn.disabled = false;
    inputEl.disabled = false;
    turnStatusEl.textContent = '';
    inputEl.focus();
  }
}

function autoScroll(el) {
  el.scrollTop = el.scrollHeight;
}

function authHeaders(extra = {}) {
  const headers = {...extra};
  if (state.currentUserToken) {
    headers['Authorization'] = 'Bearer ' + state.currentUserToken;
  }
  return headers;
}

async function apiFetch(input, options = {}) {
  const resp = await fetch(input, options);
  if (resp.status === 401) {
    logout(true);
  }
  return resp;
}

function setAuthStatus(message, level = '') {
  if (!authStatusEl) return;
  authStatusEl.textContent = message;
  authStatusEl.className = `auth-status ${level}`.trim();
}

async function apiError(resp) {
  try {
    const data = await resp.json();
    const detail = data.detail;
    if (detail && typeof detail === 'object') {
      return detail.message || detail.code || `HTTP ${resp.status}`;
    }
    return detail || data.message || `HTTP ${resp.status}`;
  } catch (e) {
    return `HTTP ${resp.status}`;
  }
}

function setAuthenticatedUser(token, userInfo) {
  state.currentUserToken = token;
  state.currentUserInfo = userInfo || null;
  state.convList = [];
  state.convCursor = null;
  state.currentConvId = null;
  state.pendingNewConvId = null;
  state.traceRequests = [];
  state.selectedRequestId = null;
  const nickname = userInfo?.nickname || userInfo?.user?.nickname || '当前用户';
  const farmUid = userInfo?.farm_uid || '未知';
  convTitleEl.textContent = `选择一个对话 · ${nickname}`;
  setAuthStatus(`User JWT 已加载 · ${nickname} · farm_uid=${farmUid}`, 'ok');
  authGateEl.classList.add('hidden');
  const userSelect = document.getElementById('user-select');
  if (userSelect && userInfo?.user_id) {
    if (![...userSelect.options].some(option => option.value === userInfo.user_id)) {
      const option = document.createElement('option');
      option.value = userInfo.user_id;
      option.textContent = `${nickname} (${userInfo.role || 'user'})`;
      userSelect.appendChild(option);
    }
    userSelect.value = userInfo.user_id;
  }
}

function showAuthGate(message = '') {
  state.currentUserToken = '';
  state.currentUserInfo = null;
  state.convList = [];
  state.convCursor = null;
  state.currentConvId = null;
  sessionStorage.removeItem('farm_manager_agent_access_token');
  authGateEl.classList.remove('hidden');
  loginErrorEl.textContent = message;
  convTitleEl.textContent = '请先登录';
  convListEl.innerHTML = '<div class="conv-empty">登录后加载会话</div>';
  setAuthStatus('未登录', 'warn');
}

function logout(silent = false) {
  showAuthGate(silent ? '登录已失效，请重新登录' : '');
  if (!silent) loginFormEl.querySelector('[name="password"]').value = '';
}

async function login(event) {
  event.preventDefault();
  loginErrorEl.textContent = '';
  loginSubmitEl.disabled = true;
  try {
    const form = new FormData(loginFormEl);
    const resp = await fetch('/api/v2/auth/login', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({phone: form.get('phone'), password: form.get('password')}),
    });
    if (!resp.ok) throw new Error(await apiError(resp));
    const data = await resp.json();
    if (!data.access_token) throw new Error('登录服务未返回认证令牌');
    const user = data.user || {};
    const userInfo = {
      ...user,
      user_id: user.id || data.user_id,
      farm_uid: data.farm_uid,
      role: user.role || data.role,
    };
    sessionStorage.setItem('farm_manager_agent_access_token', data.access_token);
    setAuthenticatedUser(data.access_token, userInfo);
    await loadConversations();
  } catch (error) {
    loginErrorEl.textContent = error.message || '登录失败';
  } finally {
    loginSubmitEl.disabled = false;
  }
}

function restoreSession() {
  const token = sessionStorage.getItem('farm_manager_agent_access_token');
  if (!token) return false;
  setAuthenticatedUser(token, null);
  return true;
}

loginFormEl.addEventListener('submit', login);

// ═══════════════════════════════════════════════════════════
// Conversation List
// ═══════════════════════════════════════════════════════════
async function loadConversations() {
  try {
    if (!state.currentUserToken) {
      convListEl.innerHTML = '<div class="conv-empty">请先选择已认证用户</div>';
      setAuthStatus('未加载 User Access Token', 'warn');
      return;
    }
    const url = state.convCursor
      ? `/api/v2/conversations?limit=20&cursor=${encodeURIComponent(state.convCursor)}`
      : `/api/v2/conversations?limit=20`;
    const resp = await apiFetch(url, {headers: authHeaders()});
    if (!resp.ok) throw new Error(await apiError(resp));
    const data = await resp.json();
    state.convList = state.convCursor
      ? [...state.convList, ...data.items]
      : data.items;
    state.convCursor = data.next_cursor;
    state.convHasMore = data.has_more;
    renderConvList();
  } catch (e) {
    console.error('loadConversations failed:', e);
    convListEl.innerHTML = `<div class="conv-empty">会话加载失败<br><small>${escapeHtml(e.message)}</small></div>`;
  }
}

async function loadDevUsers() {
  try {
    const resp = await apiFetch('/api/v2/dev-users');
    if (!resp.ok) {
      const message = await apiError(resp);
      const sel = document.getElementById('user-select');
      if (sel) sel.innerHTML = '<option value="">开发用户不可用</option>';
      setAuthStatus(`开发用户不可用：${message}`, 'error');
      return false;
    }
    const data = await resp.json();
    state.devUsers = data.users || [];
    const sel = document.getElementById('user-select');
    if (!sel) return false;
    sel.innerHTML = '<option value="">未选择用户</option>';
    state.devUsers.forEach(u => {
      const opt = document.createElement('option');
      opt.value = u.user_id;
      opt.textContent = `${u.nickname} (farm_uid:${u.farm_uid || '未绑定'}, ${u.role})`;
      sel.appendChild(opt);
    });
    if (!state.devUsers.length) {
      setAuthStatus('没有可用的 active 用户或农场', 'warn');
      return false;
    }
    sel.value = state.devUsers[0].user_id;
    selectUser(sel.value, {reload: false});
    return true;
  } catch (e) {
    console.warn('loadDevUsers failed:', e);
    setAuthStatus(`开发用户加载失败：${e.message}`, 'error');
    return false;
  }
}

function selectUser(userId, options = {}) {
  if (!userId) {
    state.currentUserToken = '';
    state.currentUserInfo = null;
    state.convList = [];
    state.convCursor = null;
    state.currentConvId = null;
    convTitleEl.textContent = '选择一个对话';
    renderConvList();
    setAuthStatus('未选择 User Access Token', 'warn');
    return;
  }
  const user = state.devUsers.find(u => u.user_id === userId);
  if (user) {
    setAuthenticatedUser(user.token, user);
    console.log(`已切换用户: ${user.nickname} (farm_uid=${user.farm_uid})`);
    renderConvList();
    if (options.reload !== false) {
      loadConversations();
    }
  }
}

function renderConvList() {
  if (!state.convList.length && !state.pendingNewConvId) {
    convListEl.innerHTML = '<div class="conv-empty"><div style="font-size:32px;margin-bottom:10px">💬</div>暂无对话</div>';
    convMoreEl.style.display = 'none';
    return;
  }
  let items = state.convList;
  if (state.pendingNewConvId && !items.find(c => c.conversation_id === state.pendingNewConvId)) {
    items = [{
      conversation_id: state.pendingNewConvId,
      last_message: '（新对话）',
      last_role: '',
      last_at: new Date().toISOString(),
      message_count: 0,
      _pending: true,
    }, ...items];
  }
  convListEl.innerHTML = items.map(c => `
    <div class="conv-item ${c.conversation_id === state.currentConvId ? 'active' : ''}"
         onclick="selectConversation('${escapeAttr(c.conversation_id)}')">
      <div class="conv-item-id">${escapeHtml(c.conversation_id)}</div>
      <div class="conv-item-preview">${escapeHtml(c.last_message || '暂无消息')}</div>
      <div class="conv-item-meta">
        <span>${escapeHtml(c.last_role === 'user' ? '你' : c.last_role === 'assistant' ? '助手' : '')}</span>
        <span class="conv-badge">${c.message_count || 0} 条</span>
      </div>
    </div>
  `).join('');
  convMoreEl.style.display = state.convHasMore ? 'block' : 'none';
}

function loadMoreConversations() {
  loadConversations();
}

async function selectConversation(convId) {
  state.currentConvId = convId;
  state.allTurns = []; // 切换会话时清空
  convTitleEl.textContent = convId;
  renderConvList();
  await loadConversationMessages(convId);
  if (state.tracePanelOpen) {
    loadTraceRequests(convId);
  }
}

function newConversation() {
  const id = 'conv-' + Date.now().toString(36);
  state.currentConvId = id;
  state.pendingNewConvId = id;
  state.allTurns = []; // 新会话清空
  convTitleEl.textContent = '新对话';
  renderConvList();
  chatMainEl.innerHTML = '';
  const emptyDiv = document.createElement('div');
  emptyDiv.className = 'chat-empty';
  emptyDiv.innerHTML = '<h3>新对话</h3><p>开始输入下方发送消息。</p>';
  chatMainEl.appendChild(emptyDiv);
  inputEl.focus();
}

async function loadConversationMessages(convId) {
  try {
    const resp = await apiFetch(`/api/v2/conversations/${encodeURIComponent(convId)}?limit=100`, {headers: authHeaders()});
    if (!resp.ok) throw new Error(await apiError(resp));
    const data = await resp.json();
    renderMessages(data.items || []);
  } catch (e) {
    console.error('loadConversationMessages failed:', e);
    chatMainEl.innerHTML = '';
    const errDiv = document.createElement('div');
    errDiv.className = 'chat-empty';
    errDiv.innerHTML = '<h3>加载错误</h3><p>无法加载对话记录。</p>';
    chatMainEl.appendChild(errDiv);
  }
}

function renderMessages(messages) {
  chatMainEl.innerHTML = '';
  if (!messages.length) {
    chatMainEl.appendChild(createChatEmpty());
    return;
  }
  for (const msg of messages) {
    const el = createMessageBubble(msg);
    chatMainEl.appendChild(el);
  }
}

function createChatEmpty() {
  const div = document.createElement('div');
  div.className = 'chat-empty';
  div.innerHTML = '<h3>暂无消息</h3><p>开始发送消息吧。</p>';
  return div;
}

function createMessageBubble(msg) {
  const el = document.createElement('div');
  el.className = 'event event-final_answer';
  if (msg.role === 'user') {
    el.style.background = 'linear-gradient(135deg, rgba(167,139,250,0.12), rgba(79,140,255,0.08))';
    el.style.borderColor = 'rgba(167,139,250,0.25)';
  }
  const label = document.createElement('div');
  label.className = 'label';
  const icon = msg.role === 'user' ? '👤' : '💬';
  const roleName = msg.role === 'user' ? '你' : '助手';
  label.innerHTML = `<span class="icon">${icon}</span>${roleName}`;
  el.appendChild(label);

  // 助手消息用 Markdown 渲染 + 添加复制按钮
  if (msg.role !== 'user') {
    const copyBtn = document.createElement('button');
    copyBtn.className = 'copy-btn';
    copyBtn.textContent = '复制 JSON';
    copyBtn.onclick = (e) => {
      e.stopPropagation();
      const jsonToCopy = {
        role: 'assistant',
        content: msg.content,
        events: msg.events || [],
      };
      navigator.clipboard.writeText(JSON.stringify(jsonToCopy, null, 2)).then(() => {
        copyBtn.textContent = '已复制 ✓';
        copyBtn.classList.add('copied');
        setTimeout(() => {
          copyBtn.textContent = '复制 JSON';
          copyBtn.classList.remove('copied');
        }, 2000);
      }).catch(() => alert('复制失败'));
    };
    el.appendChild(copyBtn);
  }

  const body = document.createElement('div');
  body.className = msg.role === 'user' ? 'assistant-text' : 'assistant-text markdown-body';
  if (msg.role === 'user') {
    body.textContent = msg.content;
  } else {
    body.innerHTML = renderMarkdown(msg.content || '');
  }
  el.appendChild(body);
  return el;
}

// ═══════════════════════════════════════════════════════════
// Chat (SSE streaming)
// ═══════════════════════════════════════════════════════════
let busy = false;
let streamingEl = null;
let streamingContent = '';

function startStreaming() {
  const el = document.createElement('div');
  el.className = 'event event-final_answer';
  
  // 添加复制按钮
  const copyBtn = document.createElement('button');
  copyBtn.className = 'copy-btn';
  copyBtn.textContent = '复制 JSON';
  copyBtn.onclick = (e) => {
    e.stopPropagation();
    copyCurrentTurnJson(copyBtn);
  };
  el.appendChild(copyBtn);

  const label = document.createElement('div');
  label.className = 'label';
  label.innerHTML = `<span class="icon">${ICONS.final_answer}</span>assistant`;
  el.appendChild(label);
  const body = document.createElement('div');
  body.className = 'assistant-text markdown-body';
  body.innerHTML = '<span class="cursor"></span>';
  el.appendChild(body);
  chatMainEl.appendChild(el);
  autoScroll(chatMainEl);
  streamingEl = body;
  streamingContent = '';
}

function renderMarkdown(text) {
  if (typeof marked !== 'undefined') {
    try {
      return marked.parse(text);
    } catch (e) {
      console.warn('marked parse failed:', e);
    }
  }
  return escapeHtml(text).replace(/\n/g, '<br>');
}

function appendStreamDelta(delta) {
  if (!streamingEl) return;
  streamingContent += delta;
  // 流式过程中用纯文本渲染（避免不完整 Markdown 导致渲染异常），最终完成时再渲染 Markdown
  streamingEl.innerHTML = escapeHtml(streamingContent).replace(/\n/g, '<br>') + '<span class="cursor"></span>';
  autoScroll(chatMainEl);
}

function finalizeStreaming(text) {
  if (streamingEl) {
    streamingEl.innerHTML = renderMarkdown(text);
    streamingEl = null;
    streamingContent = '';
    autoScroll(chatMainEl);
  }
}

function copyCurrentTurnJson(btnEl) {
  // 构建要复制的 JSON 对象
  const jsonToCopy = {
    user_input: state.currentTurnUserInput,
    events: state.currentTurnEvents,
  };
  const jsonStr = JSON.stringify(jsonToCopy, null, 2);

  navigator.clipboard.writeText(jsonStr).then(() => {
    const originalText = btnEl.textContent;
    btnEl.textContent = '已复制 ✓';
    btnEl.classList.add('copied');
    setTimeout(() => {
      btnEl.textContent = originalText;
      btnEl.classList.remove('copied');
    }, 2000);
  }).catch(err => {
    console.error('复制失败:', err);
    alert('复制失败，请手动复制');
  });
}

async function copySessionJson() {
  const btn = document.querySelector('button[onclick="copySessionJson()"]');
  const originalText = btn ? btn.textContent : '';

  let sessionData;

  // 优先用 allTurns（当前会话中实时收集的事件，含 skill 调用详情）
  if (state.allTurns && state.allTurns.length > 0) {
    sessionData = {
      conversation_id: state.currentConvId,
      total_turns: state.allTurns.length,
      turns: state.allTurns,
    };
  } else if (state.currentConvId) {
    // fallback：从 API 加载历史消息（可能不含事件详情）
    try {
      const resp = await apiFetch(`/api/v2/conversations/${encodeURIComponent(state.currentConvId)}?limit=500`, {headers: authHeaders()});
      if (!resp.ok) throw new Error(await apiError(resp));
      const data = await resp.json();
      sessionData = {
        conversation_id: state.currentConvId,
        total_messages: (data.items || []).length,
        messages: data.items || [],
        note: '从 API 加载的历史消息（可能缺少 SSE 事件详情）',
      };
    } catch (e) {
      alert('复制失败：无法加载会话数据 - ' + e.message);
      return;
    }
  } else {
    alert('没有选中的会话');
    return;
  }

  const jsonStr = JSON.stringify(sessionData, null, 2);

  // 优先用 Clipboard API，失败时 fallback 到 execCommand
  function fallbackCopy(text) {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); } catch (e) {}
    document.body.removeChild(ta);
  }

  function showSuccess() {
    if (btn) {
      btn.textContent = '已复制 ✓';
      btn.classList.add('copied');
      setTimeout(() => {
        btn.textContent = originalText;
        btn.classList.remove('copied');
      }, 2000);
    }
    const count = sessionData.turns ? sessionData.turns.length : (sessionData.total_messages || 0);
    console.log(`已复制会话 JSON: ${jsonStr.length} 字符, ${count} 轮/条`);
  }

  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(jsonStr).then(showSuccess).catch(err => {
      console.warn('Clipboard API 失败，使用 fallback:', err);
      fallbackCopy(jsonStr);
      showSuccess();
    });
  } else {
    fallbackCopy(jsonStr);
    showSuccess();
  }
}

function createFinalAnswerBubble(text) {
  const el = document.createElement('div');
  el.className = 'event event-final_answer';
  
  // 添加复制按钮
  const copyBtn = document.createElement('button');
  copyBtn.className = 'copy-btn';
  copyBtn.textContent = '复制 JSON';
  copyBtn.onclick = (e) => {
    e.stopPropagation();
    copyCurrentTurnJson(copyBtn);
  };
  el.appendChild(copyBtn);

  const label = document.createElement('div');
  label.className = 'label';
  label.innerHTML = `<span class="icon">${ICONS.final_answer}</span>assistant`;
  el.appendChild(label);
  
  const body = document.createElement('div');
  body.className = 'assistant-text markdown-body';
  el.appendChild(body);
  
  chatMainEl.appendChild(el);
  autoScroll(chatMainEl);
  streamingEl = body;
  streamingContent = '';
  const fullText = text;
  let i = 0;
  function typeNext() {
    // streaming 结束（sendMessage finally 已把 streamingEl 置 null）时，
    // 挂起的定时器回调直接返回，避免对 null 设置 innerHTML
    if (!streamingEl) return;
    if (i >= fullText.length) {
      if (typeof marked !== 'undefined') {
        streamingEl.innerHTML = marked.parse(fullText);
      } else {
        streamingEl.innerHTML = escapeHtml(fullText).replace(/\n/g, '<br>');
      }
      streamingEl = null;
      return;
    }
    const chars = Math.min(2, fullText.length - i);
    i += chars;
    streamingContent = fullText.slice(0, i);
    if (typeof marked !== 'undefined') {
      streamingEl.innerHTML = marked.parse(streamingContent + '<span class="cursor"></span>');
    } else {
      streamingEl.innerHTML = escapeHtml(streamingContent).replace(/\n/g, '<br>') + '<span class="cursor"></span>';
    }
    autoScroll(chatMainEl);
    setTimeout(typeNext, 20);
  }
  typeNext();
}

function createCollapsibleJson(label, jsonStr) {
  const escaped = escapeHtml(jsonStr);
  const lineCount = jsonStr.split('\n').length;
  const isLong = jsonStr.length > 200 || lineCount > 5;
  if (!isLong) {
    return `<div class="json-block"><pre>${escaped}</pre></div>`;
  }
  return `<div class="json-block"><details><summary><span class="chev">▶</span><span class="json-label">${escapeHtml(label)}</span><span class="json-meta">· ${lineCount} 行 · ${jsonStr.length} 字符</span></summary><pre>${escaped}</pre></details></div>`;
}

function renderContextUsageBar(data) {
  const percent = Math.min(data.percent, 100);
  const level = data.level || 'green';
  const colors = {
    green: 'var(--success)',
    yellow: 'var(--warning)',
    orange: '#fb923c',
    red: 'var(--danger)',
  };
  const color = colors[level] || colors.green;
  const usedK = (data.used / 1000).toFixed(1);
  const totalK = (data.total / 1000).toFixed(0);
  return `<div style="display:flex;align-items:center;gap:8px;font-size:11px">
    <span style="color:var(--text-muted)">ctx</span>
    <div style="flex:1;height:4px;background:var(--surface-2);border-radius:2px;overflow:hidden;max-width:200px">
      <div style="width:${percent}%;height:100%;background:${color};transition:width 0.3s"></div>
    </div>
    <span style="color:${color};font-family:monospace;font-weight:600">${percent}%</span>
    <span style="color:var(--text-muted);font-family:monospace">${usedK}K / ${totalK}K</span>
    ${data.step ? `<span style="color:var(--text-muted)">· step ${data.step}</span>` : ''}
  </div>`;
}

function appendEvent(type, data) {
  // 收集事件用于复制 JSON
  if (type === 'meta') {
    // 新一轮对话开始时，清空之前的事件
    state.currentTurnEvents = [{ type, data: JSON.parse(JSON.stringify(data)) }];
  } else if (type !== 'done' && type !== 'final_answer_start' && type !== 'final_answer_delta' && type !== 'final_answer') {
    state.currentTurnEvents.push({ type, data: JSON.parse(JSON.stringify(data)) });
  }

  if (type === 'final_answer_start') { startStreaming(); return; }
  if (type === 'final_answer_delta') { appendStreamDelta(data.delta); return; }
  if (type === 'final_answer') {
    // 将最终答案也存入事件列表
    state.currentTurnEvents.push({ type, data: JSON.parse(JSON.stringify(data)) });
    if (streamingEl) { finalizeStreaming(data.text); }
    else { createFinalAnswerBubble(data.text); }
    return;
  }

  const el = document.createElement('div');
  el.className = 'event event-' + type;
  const label = document.createElement('div');
  label.className = 'label';
  label.textContent = type.replace(/_/g, ' ');
  label.innerHTML = `<span class="icon">${ICONS[type] || '●'}</span>${label.textContent}`;
  el.appendChild(label);

  const body = document.createElement('div');
  switch (type) {
    case 'meta':
      el.classList.add('event-meta');
      el.innerHTML = `<span class="turn-badge">turn: ${escapeHtml(data.turn_id)}</span> conv: ${escapeHtml(data.conversation_id)}${data.request_id ? ' · <span style="color:var(--info);cursor:pointer;text-decoration:underline" onclick="jumpToTrace(\'' + escapeAttr(data.request_id) + '\')">req: ' + escapeHtml(data.request_id) + '</span>' : ''}`;
      break;
    case 'thought':
      body.className = 'thought-content';
      body.textContent = data.content;
      el.appendChild(body);
      break;
    case 'plan':
      body.innerHTML = '<ol>' + data.steps.map(s => `<li>${escapeHtml(s)}</li>`).join('') + '</ol>';
      el.appendChild(body);
      break;
    case 'action':
      body.innerHTML = `<div class="tool-result-summary"><span class="tool-name">${escapeHtml(data.tool_name)}</span></div>` +
        (data.rationale ? `<div style="opacity:0.7;margin-top:6px;font-size:13px">${escapeHtml(data.rationale)}</div>` : '') +
        createCollapsibleJson('参数', JSON.stringify(data.arguments, null, 2));
      el.appendChild(body);
      break;
    case 'observation':
      body.innerHTML = `<div class="tool-result-summary"><span class="tool-name">${escapeHtml(data.tool_name)}</span>` +
        (data.error ? ' <span style="color:var(--danger)">error</span>' : ' <span style="color:var(--success)">ok</span>') +
        '</div>' +
        (data.error ? `<div style="color:var(--danger);margin-top:6px">${escapeHtml(data.error)}</div>` :
         createCollapsibleJson('结果', JSON.stringify(data.result, null, 2)));
      el.appendChild(body);
      break;
    case 'approval_required':
      body.innerHTML = renderApprovalCard(data);
      el.appendChild(body);
      break;
    case 'approval_result':
      body.innerHTML = `<b>${data.decision === 'approved' ? '✓ 已批准' : '✗ 已拒绝'}</b>` +
        (data.reason ? ` — ${escapeHtml(data.reason)}` : '');
      el.appendChild(body);
      break;
    case 'operation_committed':
      body.innerHTML = `<b style="color:var(--success)">✓ 业务写入已提交</b>` +
        createCollapsibleJson('提交结果', JSON.stringify(data.result, null, 2));
      el.appendChild(body);
      break;
    case 'write_committed_reply_failed':
      body.innerHTML = `<b style="color:var(--warning)">${escapeHtml(data.code)}</b>: ${escapeHtml(data.message)}`;
      el.appendChild(body);
      break;
    case 'context_usage':
      el.classList.add('event-meta');
      body.innerHTML = renderContextUsageBar(data);
      el.appendChild(body);
      break;
    case 'context_compressing':
      body.innerHTML = `<b style="color:var(--warning)">⚠ 上下文压缩</b> · 触发：${escapeHtml(data.trigger)} · 占用 ${data.before_percent}%`;
      el.appendChild(body);
      break;
    case 'context_compressed':
      body.innerHTML = `<b style="color:var(--success)">✓ 压缩完成</b> · 占用降至 ${data.after_percent}%` +
        (data.summary_preview ? `<div style="opacity:0.7;margin-top:6px;font-size:12px">摘要：${escapeHtml(data.summary_preview)}...</div>` : '');
      el.appendChild(body);
      break;
    case 'doom_loop_warning':
      body.innerHTML = `<b style="color:var(--danger)">⛔ 死循环检测</b> · ${escapeHtml(data.message)}`;
      el.appendChild(body);
      break;
    case 'verification_warning':
      body.innerHTML = `<b style="color:var(--warning)">⚠ 检查警告</b>` +
        `<ul style="margin-top:6px;padding-left:20px">${data.issues.map(i => `<li>${escapeHtml(i)}</li>`).join('')}</ul>`;
      el.appendChild(body);
      break;
    case 'plan_created':
      body.innerHTML = `<div><b style="color:var(--purple)">📋 计划</b> · ${escapeHtml(data.goal)} · ${data.step_count} 步</div>` +
        `<ol style="margin-top:8px;padding-left:24px">${data.steps.map(s => `<li><b>${escapeHtml(s.skill)}</b> — ${escapeHtml(s.description || '')}</li>`).join('')}</ol>`;
      el.appendChild(body);
      break;
    case 'plan_step_done':
      body.innerHTML = `<b>步骤 ${data.step_index + 1}</b> · <span style="font-family:monospace;color:var(--info)">${escapeHtml(data.skill)}</span> · ` +
        `<span style="color:${data.status === 'done' ? 'var(--success)' : 'var(--danger)'}">${escapeHtml(data.status)}</span>`;
      el.appendChild(body);
      break;
    case 'error':
      body.innerHTML = `<b>${escapeHtml(data.code || 'error')}</b>: ${escapeHtml(data.message)}`;
      el.appendChild(body);
      break;
    case 'done':
      el.classList.add('event-done');
      el.textContent = `✓ 对话完成 · 状态：${data.status === 'completed' ? '成功' : data.status === 'failed' ? '失败' : data.status}`;
      // 保存当前轮次到 allTurns（用于复制整个 session）
      state.allTurns.push({
        user_input: state.currentTurnUserInput,
        events: [...state.currentTurnEvents],
        status: data.status,
      });
      // 对话完成后自动刷新 trace 和对话列表
      if (state.tracePanelOpen) {
        loadTraceRequests(state.currentConvId);
      }
      loadConversations();
      break;
    default:
      body.textContent = JSON.stringify(data);
      el.appendChild(body);
  }
  el.appendChild(body);
  chatMainEl.appendChild(el);
  autoScroll(chatMainEl);
}

async function sendMessage() {
  const msg = inputEl.value.trim();
  if (!msg || busy) return;
  if (!state.currentUserToken) {
    setAuthStatus('请先选择 User Access Token', 'warn');
    alert('请先选择已认证用户，再发送消息');
    return;
  }
  if (!state.currentConvId) {
    newConversation();
  }
  inputEl.value = '';
  setBusy(true);

  // 保存用户输入用于复制 JSON
  state.currentTurnUserInput = msg;

  // Show user message
  const userEvent = document.createElement('div');
  userEvent.className = 'event event-final_answer';
  userEvent.style.background = 'linear-gradient(135deg, rgba(167,139,250,0.12), rgba(79,140,255,0.08))';
  userEvent.style.borderColor = 'rgba(167,139,250,0.25)';
  const label = document.createElement('div');
  label.className = 'label';
  label.innerHTML = '<span class="icon">👤</span>你';
  userEvent.appendChild(label);
  const body = document.createElement('div');
  body.className = 'assistant-text';
  body.textContent = msg;
  userEvent.appendChild(body);
  chatMainEl.appendChild(userEvent);
  autoScroll(chatMainEl);

  try {
    const headers = authHeaders({'Content-Type': 'application/json'});
    const resp = await apiFetch('/api/v2/chat', {
      method: 'POST',
      headers: headers,
      body: JSON.stringify({message: msg, conversation_id: state.currentConvId}),
    });
    if (!resp.ok) throw new Error(await apiError(resp));

    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';
    let capturedRequestId = null;

    while (true) {
      const {done, value} = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, {stream: true});
      const events = buffer.split('\n\n');
      buffer = events.pop();
      for (const block of events) {
        const lines = block.split('\n');
        let type = 'message', data = '';
        for (const line of lines) {
          if (line.startsWith('event: ')) type = line.slice(7);
          else if (line.startsWith('data: ')) data += line.slice(6);
        }
        if (!data) continue;
        console.log('[SSE] event:', type, 'at', new Date().toLocaleTimeString());
        try {
          const parsed = JSON.parse(data);
          if (type === 'meta' && parsed.request_id) {
            capturedRequestId = parsed.request_id;
            state.lastRequestId = parsed.request_id;
          }
          appendEvent(type, parsed);
        } catch (e) {
          appendEvent('error', {code: 'parse', message: data});
        }
      }
    }

    // After chat completes, clear pending new conversation flag and refresh
    if (state.pendingNewConvId) {
      state.pendingNewConvId = null;
    }
  } catch (e) {
    appendEvent('error', {code: 'network', message: e.message});
  } finally {
    if (streamingEl) {
      // SSE 流中断时用 Markdown 渲染已有内容（而不是纯文本）
      streamingEl.innerHTML = renderMarkdown(streamingContent);
      streamingEl = null;
    }
    setBusy(false);
    // Reload conversation messages to show persisted history
    if (state.currentConvId) {
      await loadConversationMessages(state.currentConvId);
    }
  }
}

function renderApprovalCard(data) {
  const plan = data.plan;
  const hasPlan = plan && typeof plan === 'object';
  // 种植计划审批：展示模板动作、茬口、种植单元等结构化字段，而非原始 JSON
  let planHtml = '';
  if (hasPlan) {
    const tplActionMap = {use_existing: '复用现有模板', import_system: '导入系统模板', create_custom: '创建自定义模板'};
    const tpl = plan.template || {};
    const cycle = plan.cycle || {};
    const unit = plan.planting_unit || {};
    const stages = Array.isArray(tpl.stages) ? tpl.stages : [];
    planHtml = `
      <div style="margin-top:8px;border:1px solid var(--border);border-radius:6px;padding:10px;background:var(--surface)">
        <div style="font-size:13px;color:var(--text-2)">种植计划审批</div>
        <div style="margin-top:6px"><b>作物：</b>${escapeHtml(plan.crop_name || '-')}${plan.variety ? `（${escapeHtml(plan.variety)}）` : ''}</div>
        <div style="margin-top:4px"><b>模板：</b>${escapeHtml(tplActionMap[plan.template_action] || plan.template_action || '-')} · ${escapeHtml(tpl.name || '-')}${stages.length ? `（${stages.length} 个阶段：${stages.map(s => escapeHtml(s.name)).join('、')}）` : ''}</div>
        <div style="margin-top:4px"><b>茬口：</b>${escapeHtml(cycle.name || '-')} · 开始 ${escapeHtml(cycle.start_date || '-')} · 面积 ${cycle.total_area_mu ?? '-'} 亩</div>
        <div style="margin-top:4px"><b>种植单元：</b>${escapeHtml(unit.name || '-')} · ${escapeHtml(unit.planted_date || '-')} · 面积 ${unit.area_mu ?? '-'} 亩</div>
      </div>`;
  }
  return `
    <div><b style="color:var(--warning)">需要确认</b> · 风险等级：<code style="background:var(--surface-2);padding:2px 6px;border-radius:4px">${escapeHtml(data.risk_level)}</code></div>
    <div style="margin-top:8px;font-size:13px"><b>工具：</b><span style="font-family:monospace;color:var(--info)">${escapeHtml(data.tool_name)}</span></div>
    ${data.summary ? `<div style="margin-top:6px;font-size:13px">${escapeHtml(data.summary)}</div>` : ''}
    ${planHtml}
    <div style="margin-top:8px"><b style="font-size:13px">参数：</b></div>
    ${createCollapsibleJson('参数', JSON.stringify(data.arguments, null, 2))}
    ${data.rationale && !data.summary ? `<div style="margin-top:8px;opacity:0.8;font-size:13px">${escapeHtml(data.rationale)}</div>` : ''}
    <div class="approval-buttons" id="approve-${escapeAttr(data.turn_id)}">
      <button class="btn-approve" onclick="approveTurn('${escapeAttr(data.turn_id)}', this, true)">确认执行</button>
      <button class="btn-reject" onclick="approveTurn('${escapeAttr(data.turn_id)}', this, false)">取消</button>
    </div>`;
}

async function approveTurn(turnId, btnEl, decision) {
  if (!state.currentUserToken) {
    setAuthStatus('请先选择 User Access Token', 'warn');
    alert('审批需要 User Access Token');
    return;
  }
  const btnContainer = btnEl.closest('.approval-buttons');
  if (btnContainer) {
    const buttons = btnContainer.querySelectorAll('button');
    buttons.forEach(b => { b.disabled = true; b.style.opacity = '0.5'; b.style.pointerEvents = 'none'; });
  }
  try {
    const resp = await apiFetch('/api/v2/approve', {
      method: 'POST',
      headers: authHeaders({'Content-Type': 'application/json'}),
      body: JSON.stringify({turn_id: turnId, decision: decision, reason: ''}),
    });
    if (!resp.ok) {
      alert('批准失败：' + await apiError(resp));
      if (btnContainer) {
        const buttons = btnContainer.querySelectorAll('button');
        buttons.forEach(b => { b.disabled = false; b.style.opacity = ''; b.style.pointerEvents = ''; });
      }
    }
  } catch (e) {
    alert('网络错误：' + e.message);
    if (btnContainer) {
      const buttons = btnContainer.querySelectorAll('button');
      buttons.forEach(b => { b.disabled = false; b.style.opacity = ''; b.style.pointerEvents = ''; });
    }
  }
}

async function resetConversation() {
  if (!state.currentConvId || !state.currentUserToken) return;
  if (!confirm('确认清空当前会话记忆？')) return;
  await apiFetch('/api/v2/reset', {
    method: 'POST',
    headers: authHeaders({'Content-Type': 'application/json'}),
    body: JSON.stringify({conversation_id: state.currentConvId}),
  });
  chatMainEl.innerHTML = '';
  streamingEl = null;
  streamingContent = '';
  state.pendingNewConvId = null;
  state.selectedRequestId = null;
  const emptyDiv = document.createElement('div');
  emptyDiv.className = 'chat-empty';
  emptyDiv.innerHTML = '<h3>对话已重置</h3><p>开始新的对话。</p>';
  chatMainEl.appendChild(emptyDiv);
  if (state.tracePanelOpen) {
    loadTraceRequests(state.currentConvId);
  }
  loadConversations();
}

// ═══════════════════════════════════════════════════════════
// Trace Panel
// ═══════════════════════════════════════════════════════════
function toggleTrace() {
  state.tracePanelOpen = !state.tracePanelOpen;
  tracePanelEl.classList.toggle('open', state.tracePanelOpen);
  document.getElementById('trace-toggle-btn').classList.toggle('active', state.tracePanelOpen);
  if (state.tracePanelOpen) {
    loadTraceRequests(state.currentConvId);
  }
}

function refreshTrace() {
  if (state.currentConvId) {
    loadTraceRequests(state.currentConvId);
  }
}

function switchTraceTab(tab) {
  state.traceTab = tab;
  traceTabEls.forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
  renderTraceBody();
}

async function loadTraceRequests(convId) {
  if (!convId) {
    traceBodyEl.innerHTML = '<div class="trace-empty">请先选择对话</div>';
    return;
  }
  try {
    traceBodyEl.innerHTML = '<div class="trace-empty">加载中...</div>';
    const url = `/api/v2/traces?conversation_id=${encodeURIComponent(convId)}&limit=20`;
    const resp = await apiFetch(url, {headers: authHeaders()});
    if (!resp.ok) throw new Error(await apiError(resp));
    const data = await resp.json();
    state.traceRequests = data.items || [];
    state.traceCursor = data.next_cursor;
    state.traceHasMore = data.has_more;
    state.traceTab = 'requests';
    traceTabEls.forEach(t => t.classList.toggle('active', t.dataset.tab === 'requests'));
    renderTraceBody();
  } catch (e) {
    console.error('loadTraceRequests failed:', e);
    traceBodyEl.innerHTML = '<div class="trace-empty">加载失败</div>';
  }
}

function renderTraceBody() {
  if (state.traceTab === 'requests') {
    renderTraceRequests();
  } else {
    renderTraceDetail();
  }
}

function renderTraceRequests() {
  if (!state.traceRequests.length) {
    traceBodyEl.innerHTML = '<div class="trace-empty">暂无 Trace 记录<br>发送消息后自动生成</div>';
    return;
  }
  traceBodyEl.innerHTML = state.traceRequests.map(r => {
    const isLatest = r.request_id === state.lastRequestId;
    return `
    <div class="trace-request-item ${isLatest ? 'active' : ''}" onclick="selectTraceRequest('${escapeAttr(r.request_id)}')">
      <div class="trace-req-header">
        <span class="trace-req-id">${escapeHtml(r.request_id)}${isLatest ? ' ← 最新' : ''}</span>
        <span class="trace-req-status ${escapeAttr(r.status)}">${escapeHtml(r.status === 'success' ? '成功' : r.status === 'failed' ? '失败' : r.status === 'blocked' ? '阻断' : r.status)}</span>
      </div>
      <div class="trace-req-meta">
        <span>${r.node_count || 0} 节点</span>
        <span>${r.total_duration_ms || 0}ms</span>
        ${r.error_count ? `<span style="color:var(--danger)">${r.error_count} 错误</span>` : ''}
      </div>
      ${r.metrics && r.metrics.llm_calls ? `<div class="trace-req-meta"><span>LLM: ${r.metrics.llm_calls}次</span><span>Tokens: ${r.metrics.total_tokens || 0}</span></div>` : ''}
    </div>`;
  }).join('');
}

async function selectTraceRequest(requestId) {
  state.selectedRequestId = requestId;
  state.traceTab = 'detail';
  traceTabEls.forEach(t => t.classList.toggle('active', t.dataset.tab === 'detail'));
  traceBodyEl.innerHTML = '<div class="trace-empty">Loading...</div>';

  try {
    const [nodesResp, summaryResp] = await Promise.all([
      apiFetch(`/api/v2/traces/${encodeURIComponent(requestId)}`, {headers: authHeaders()}),
      apiFetch(`/api/v2/traces/${encodeURIComponent(requestId)}/summary`, {headers: authHeaders()}),
    ]);
    if (!nodesResp.ok) throw new Error(`HTTP ${nodesResp.status}`);
    const nodesData = await nodesResp.json();
    state.traceNodes = nodesData.nodes || [];

    if (summaryResp.ok) {
      state.traceSummary = await summaryResp.json();
    } else {
      state.traceSummary = null;
    }
    renderTraceDetail();
  } catch (e) {
    console.error('selectTraceRequest failed:', e);
    traceBodyEl.innerHTML = '<div class="trace-empty">Failed to load trace detail</div>';
  }
}

function renderTraceDetail() {
  if (!state.selectedRequestId) {
    traceBodyEl.innerHTML = '<div class="trace-empty">从列表选择一个请求查看详情</div>';
    return;
  }

  let html = '';

  // Summary section
  if (state.traceSummary) {
    const s = state.traceSummary;
    const statusClass = s.status === 'success' ? '' : s.status;
    html += `
      <div class="trace-detail-header">
        <h4>${escapeHtml(s.request_id || state.selectedRequestId)}</h4>
        <div class="trace-summary-grid">
          <div><span class="label">状态</span> <span class="value" style="color:${s.status === 'success' ? 'var(--success)' : 'var(--danger)'}">${escapeHtml(s.status === 'success' ? '成功' : s.status === 'failed' ? '失败' : s.status === 'blocked' ? '阻断' : s.status)}</span></div>
          <div><span class="label">节点数</span> <span class="value">${s.node_count || 0}</span></div>
          <div><span class="label">耗时</span> <span class="value">${s.total_duration_ms || 0}ms</span></div>
          <div><span class="label">错误</span> <span class="value" style="color:${s.error_count ? 'var(--danger)' : ''}">${s.error_count || 0}</span></div>
          <div><span class="label">开始</span> <span class="value" style="font-size:10px">${escapeHtml(s.started_at || '')}</span></div>
          <div><span class="label">Turn</span> <span class="value" style="font-size:10px">${escapeHtml(s.turn_id || '')}</span></div>
        </div>`;
    if (s.root_error) {
      html += `<div style="margin-top:8px;padding:8px;background:var(--danger-bg);border-radius:6px;border:1px solid rgba(248,113,113,0.3)">`;
      html += `<div style="color:var(--danger);font-size:11px;font-weight:600;margin-bottom:4px">错误详情</div>`;
      html += `<div style="font-size:11px"><b>${escapeHtml(s.root_error.code || '')}</b>: ${escapeHtml(s.root_error.message || '')}</div>`;
      html += `</div>`;
    }
    if (s.metrics) {
      html += `<div style="margin-top:8px;padding-top:8px;border-top:1px solid var(--border)">`;
      html += `<div style="font-size:10px;color:var(--text-muted);margin-bottom:4px">性能指标</div>`;
      html += `<div class="trace-summary-grid">`;
      html += `<div><span class="label">LLM 调用</span> <span class="value">${s.metrics.llm_calls || 0}</span></div>`;
      html += `<div><span class="label">工具调用</span> <span class="value">${s.metrics.tool_calls || 0}</span></div>`;
      html += `<div><span class="label">Prompt tokens</span> <span class="value">${s.metrics.prompt_tokens || 0}</span></div>`;
      html += `<div><span class="label">总 tokens</span> <span class="value">${s.metrics.total_tokens || 0}</span></div>`;
      html += `</div></div>`;
    }
    if (s.node_breakdown && s.node_breakdown.length) {
      html += `<div style="margin-top:8px;padding-top:8px;border-top:1px solid var(--border)">`;
      html += `<div style="font-size:10px;color:var(--text-muted);margin-bottom:4px">按类型分组</div>`;
      for (const b of s.node_breakdown) {
        html += `<div class="trace-breakdown-item">
          <span class="type">${escapeHtml(b.node_type)}</span>
          <span class="stats">
            <span>${b.count}×</span>
            <span>${b.duration_ms_total}ms</span>
            ${b.error_count ? `<span style="color:var(--danger)">${b.error_count} err</span>` : ''}
          </span>
        </div>`;
      }
      html += `</div>`;
    }
    html += `</div>`;
  }

  // Node list
  if (state.traceNodes.length) {
    html += `<div style="font-size:10px;color:var(--text-muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:0.5px">追踪节点</div>`;
    html += state.traceNodes.map(n => {
      const isErr = n.status && n.status !== 'success';
      return `
        <div class="trace-node ${isErr ? 'has-error' : ''}" onclick="toggleTraceNode(this, '${escapeAttr(n.node_type)}', ${n.step_index || 0})">
          <div class="trace-node-row">
            <span class="trace-node-step">#${n.step_index || 0}</span>
            <span class="trace-node-name">${escapeHtml(n.node_name)}</span>
            <span class="trace-node-type">${escapeHtml(n.node_type)}</span>
            <span class="trace-node-dur">${n.duration_ms || 0}ms</span>
          </div>
          <div class="trace-node-detail hidden">
            ${n.input_data ? `<div><div class="detail-label">输入</div><pre>${escapeHtml(typeof n.input_data === 'string' ? n.input_data : JSON.stringify(n.input_data, null, 2))}</pre></div>` : ''}
            ${n.output_data ? `<div style="margin-top:8px"><div class="detail-label">输出</div><pre>${escapeHtml(typeof n.output_data === 'string' ? n.output_data : JSON.stringify(n.output_data, null, 2))}</pre></div>` : ''}
            ${n.error_message ? `<div style="margin-top:8px;color:var(--danger)"><div class="detail-label">错误</div><pre>${escapeHtml(n.error_message)}</pre></div>` : ''}
            ${n.token_usage ? `<div style="margin-top:8px"><div class="detail-label">Token 用量</div><pre>${escapeHtml(JSON.stringify(n.token_usage, null, 2))}</pre></div>` : ''}
          </div>
        </div>
      `;
    }).join('');
  } else {
    html += '<div class="trace-empty">暂无追踪节点数据</div>';
  }

  traceBodyEl.innerHTML = html;
}

function toggleTraceNode(el, nodeType, stepIndex) {
  const detail = el.querySelector('.trace-node-detail');
  if (detail) {
    detail.classList.toggle('hidden');
    el.classList.toggle('selected');
  }
}

function jumpToTrace(requestId) {
  state.lastRequestId = requestId;
  toggleTrace();
  selectTraceRequest(requestId);
}

// ═══════════════════════════════════════════════════════════
// Init
// ═══════════════════════════════════════════════════════════
async function init() {
  try {
    if (restoreSession()) {
      await loadConversations();
    } else {
      // 开发环境保留用户切换入口；生产环境接口返回 404，不会泄露用户或令牌。
      const userReady = await loadDevUsers();
      if (userReady) {
        await loadConversations();
      } else {
        showAuthGate();
      }
    }
  } catch (e) {
    console.error('Failed to load conversations:', e);
    showAuthGate('初始化失败，请重新登录');
  }
  inputEl.focus();
}

init();
</script>
