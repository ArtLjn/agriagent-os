<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>farm-manager agent</title>
<style>
  :root {
    --bg: #0f1115;
    --surface: #171a21;
    --surface-2: #1e222b;
    --border: #2a2f3a;
    --text: #e4e6eb;
    --text-dim: #8b90a0;
    --text-muted: #5a6070;
    --primary: #4f8cff;
    --primary-hover: #3d7ae0;
    --success: #34d399;
    --success-bg: rgba(52, 211, 153, 0.12);
    --warning: #fbbf24;
    --warning-bg: rgba(251, 191, 36, 0.12);
    --danger: #f87171;
    --danger-bg: rgba(248, 113, 113, 0.12);
    --info: #60a5fa;
    --info-bg: rgba(96, 165, 250, 0.12);
    --purple: #a78bfa;
    --purple-bg: rgba(167, 139, 250, 0.12);
    --radius: 12px;
    --radius-sm: 8px;
    --shadow: 0 4px 24px rgba(0,0,0,0.3);
    --transition: 150ms ease;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI",
                 "PingFang SC", "Helvetica Neue", Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 14px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-shrink: 0;
  }
  header h1 {
    font-size: 15px;
    font-weight: 600;
    letter-spacing: -0.01em;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  header h1 .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--success);
    box-shadow: 0 0 8px var(--success);
  }
  header .actions { display: flex; gap: 8px; }
  header button {
    background: var(--surface-2);
    color: var(--text-dim);
    border: 1px solid var(--border);
    padding: 6px 14px;
    border-radius: var(--radius-sm);
    font-size: 12px;
    cursor: pointer;
    transition: all var(--transition);
    min-height: 32px;
  }
  header button:hover {
    background: var(--border);
    color: var(--text);
  }

  .turn-status {
    font-size: 13px;
    color: var(--text-dim);
    display: flex;
    align-items: center;
    gap: 6px;
  }

  main {
    flex: 1;
    overflow-y: auto;
    padding: 24px 20px;
    scroll-behavior: smooth;
  }
  main::-webkit-scrollbar { width: 6px; }
  main::-webkit-scrollbar-track { background: transparent; }
  main::-webkit-scrollbar-thumb {
    background: var(--border);
    border-radius: 3px;
  }

  .event {
    background: var(--surface);
    border-radius: var(--radius);
    padding: 14px 18px;
    margin-bottom: 10px;
    border: 1px solid var(--border);
    max-width: 85%;
    animation: fadeSlide 0.25s ease-out;
    transition: border-color var(--transition);
  }
  .event:hover { border-color: var(--text-muted); }

  @keyframes fadeSlide {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .event-meta {
    background: transparent;
    border: none;
    padding: 6px 18px;
    max-width: 100%;
    color: var(--text-muted);
    font-size: 12px;
    display: flex;
    gap: 10px;
    align-items: center;
  }
  .event-meta .turn-badge {
    background: var(--surface-2);
    padding: 2px 8px;
    border-radius: 4px;
    font-family: "SF Mono", Menlo, monospace;
    font-size: 11px;
    color: var(--text-dim);
  }

  .event-thought {
    background: var(--surface-2);
    border-color: var(--border);
    color: var(--text-dim);
    font-size: 13px;
    font-style: italic;
  }
  .event-thought .label { color: var(--text-muted); }

  .event-plan {
    background: var(--purple-bg);
    border-color: rgba(167, 139, 250, 0.3);
  }
  .event-plan ol { margin-left: 20px; margin-top: 6px; }
  .event-plan li { margin-bottom: 2px; }

  .event-action {
    background: var(--info-bg);
    border-color: rgba(96, 165, 250, 0.25);
  }

  .event-observation {
    background: var(--success-bg);
    border-color: rgba(52, 211, 153, 0.25);
  }

  .event-approval_required {
    background: var(--warning-bg);
    border-color: rgba(251, 191, 36, 0.35);
    padding: 16px 20px;
  }

  .event-approval_result {
    background: var(--purple-bg);
    border-color: rgba(167, 139, 250, 0.3);
  }

  .event-final_answer_start {
    background: transparent;
    border: none;
    padding: 0;
    max-width: 100%;
    animation: none;
  }

  .event-final_answer {
    background: linear-gradient(135deg, rgba(79, 140, 255, 0.15), rgba(52, 211, 153, 0.1));
    border: 1px solid rgba(79, 140, 255, 0.3);
    color: var(--text);
    font-size: 15px;
    padding: 18px 22px;
    max-width: 85%;
    animation: fadeSlide 0.3s ease-out;
  }
  .event-final_answer .label {
    color: var(--primary);
    font-weight: 600;
    font-size: 11px;
    letter-spacing: 0.8px;
  }

  .assistant-text {
    min-height: 1.5em;
    position: relative;
  }
  .assistant-text .cursor {
    display: inline-block;
    width: 2px;
    height: 1em;
    background: var(--primary);
    margin-left: 2px;
    vertical-align: text-bottom;
    animation: blink 0.6s step-end infinite;
  }
  @keyframes blink {
    50% { opacity: 0; }
  }

  .event-error {
    background: var(--danger-bg);
    border-color: rgba(248, 113, 113, 0.35);
    color: var(--danger);
  }

  .event-done {
    background: transparent;
    border: none;
    padding: 6px 18px;
    max-width: 100%;
    color: var(--text-muted);
    font-size: 12px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .event-done::before {
    content: "✓";
    color: var(--success);
    font-size: 14px;
  }

  .event .label {
    font-size: 10px;
    font-weight: 600;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.8px;
    margin-bottom: 6px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .event .label .icon {
    font-size: 12px;
  }

  .event pre {
    background: rgba(0,0,0,0.3);
    padding: 10px 12px;
    border-radius: var(--radius-sm);
    overflow-x: auto;
    font-size: 12px;
    margin-top: 8px;
    font-family: "SF Mono", Menlo, "Fira Code", monospace;
    line-height: 1.5;
    color: var(--text);
  }

  .json-block {
    margin-top: 8px;
  }
  .json-block > pre {
    margin-top: 0;
  }
  .json-block > details > summary {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 6px 10px;
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    cursor: pointer;
    font-size: 12px;
    color: var(--text-dim);
    user-select: none;
    transition: background var(--transition);
    list-style: none;
  }
  .json-block > details > summary::-webkit-details-marker {
    display: none;
  }
  .json-block > details > summary:hover {
    background: rgba(255,255,255,0.08);
    color: var(--text);
  }
  .json-block > details > summary .chev {
    display: inline-block;
    transition: transform 0.2s ease;
    font-size: 10px;
    color: var(--text-muted);
  }
  .json-block > details[open] > summary .chev {
    transform: rotate(90deg);
  }
  .json-block > details > summary .json-label {
    font-weight: 600;
    color: var(--text);
  }
  .json-block > details > summary .json-meta {
    color: var(--text-muted);
    font-size: 11px;
  }
  .json-block > details > pre {
    margin-top: 6px;
  }

  .approval-buttons {
    margin-top: 14px;
    display: flex;
    gap: 10px;
  }
  .approval-buttons button {
    padding: 8px 20px;
    border: none;
    border-radius: var(--radius-sm);
    cursor: pointer;
    font-size: 13px;
    font-weight: 600;
    transition: all var(--transition);
    min-height: 36px;
  }
  .btn-approve {
    background: var(--success);
    color: #064e3b;
  }
  .btn-approve:hover:not(:disabled) {
    background: #10b981;
    transform: translateY(-1px);
  }
  .btn-reject {
    background: var(--danger);
    color: #450a0a;
  }
  .btn-reject:hover:not(:disabled) {
    background: #ef4444;
    transform: translateY(-1px);
  }
  .approval-buttons button:disabled {
    opacity: 0.4;
    cursor: not-allowed;
    transform: none;
  }

  footer {
    background: var(--surface);
    border-top: 1px solid var(--border);
    padding: 14px 20px;
    display: flex;
    gap: 10px;
    flex-shrink: 0;
  }
  footer input {
    flex: 1;
    padding: 11px 16px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    font-size: 14px;
    outline: none;
    color: var(--text);
    transition: border-color var(--transition);
  }
  footer input::placeholder { color: var(--text-muted); }
  footer input:focus { border-color: var(--primary); }

  footer button {
    background: var(--primary);
    color: #fff;
    border: none;
    padding: 0 24px;
    border-radius: var(--radius);
    font-size: 14px;
    cursor: pointer;
    font-weight: 600;
    transition: all var(--transition);
    min-height: 44px;
  }
  footer button:hover:not(:disabled) {
    background: var(--primary-hover);
    transform: translateY(-1px);
  }
  footer button:disabled {
    background: var(--surface-2);
    color: var(--text-muted);
    cursor: not-allowed;
  }

  .spinner {
    display: inline-block;
    width: 12px;
    height: 12px;
    border: 2px solid var(--border);
    border-top-color: var(--primary);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .tool-result-summary {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
  }
  .tool-result-summary .tool-name {
    font-weight: 600;
    color: var(--info);
    font-family: "SF Mono", Menlo, monospace;
    font-size: 12px;
  }

  .thought-content {
    white-space: pre-wrap;
    word-wrap: break-word;
  }

  .final-content {
    white-space: pre-wrap;
    word-wrap: break-word;
  }

  .hidden { display: none !important; }

  @media (max-width: 640px) {
    .event { max-width: 100%; }
    header h1 { font-size: 14px; }
    main { padding: 16px 12px; }
    footer { padding: 12px; }
  }
</style>
</head>
<body>
<header>
  <h1><span class="dot"></span> farm-manager agent</h1>
  <div class="turn-status" id="turn-status"></div>
  <div class="actions">
    <button onclick="resetConversation()">重置会话</button>
  </div>
</header>

<main id="events"></main>

<footer>
  <input id="msg-input" type="text" placeholder="问点什么…（Enter 发送）"
         onkeydown="if(event.key==='Enter') sendMessage()" autocomplete="off">
  <button id="send-btn" onclick="sendMessage()">发送</button>
</footer>

<script>
const eventsEl = document.getElementById('events');
const inputEl = document.getElementById('msg-input');
const sendBtn = document.getElementById('send-btn');
const turnStatusEl = document.getElementById('turn-status');

let busy = false;
let streamingEl = null;
let streamingContent = '';

const ICONS = {
  meta: '●', thought: '💭', plan: '📋', action: '⚡',
  observation: '📊', approval_required: '⚠️', approval_result: '✅',
  final_answer: '💬', error: '⛔', done: '✓'
};

function setBusy(state) {
  busy = state;
  sendBtn.disabled = state;
  inputEl.disabled = state;
  if (state) {
    turnStatusEl.innerHTML = '<span class="spinner"></span>处理中';
  } else {
    turnStatusEl.textContent = '';
  }
}

function autoScroll() {
  eventsEl.scrollTop = eventsEl.scrollHeight;
}

const JSON_COLLAPSE_THRESHOLD = 200;

function createCollapsibleJson(label, jsonStr) {
  const escaped = escapeHtml(jsonStr);
  const lineCount = jsonStr.split('\n').length;
  const isLong = jsonStr.length > JSON_COLLAPSE_THRESHOLD || lineCount > 5;
  if (!isLong) {
    return `<div class="json-block"><pre>${escaped}</pre></div>`;
  }
  const summary = `${label} · ${lineCount} 行 · ${jsonStr.length} 字符`;
  return `<div class="json-block"><details><summary><span class="chev">▶</span><span class="json-label">${escapeHtml(label)}</span><span class="json-meta">· ${lineCount} 行 · ${jsonStr.length} 字符</span></summary><pre>${escaped}</pre></details></div>`;
}

function appendEvent(type, data) {
  if (type === 'final_answer_start') {
    startStreaming();
    return;
  }
  if (type === 'final_answer_delta') {
    appendStreamDelta(data.delta);
    return;
  }
  if (type === 'final_answer') {
    if (streamingEl) {
      finalizeStreaming(data.text);
    } else {
      createFinalAnswerBubble(data.text);
    }
    return;
  }

  const el = document.createElement('div');
  el.className = 'event event-' + type;

  const label = document.createElement('div');
  label.className = 'label';
  label.textContent = type.replace(/_/g, ' ');
  label.innerHTML = `<span class="icon">${ICONS[type] || '●'}</span>${label.textContent}`;
  el.appendChild(label);

  const body = document.createElement('div');
  switch (type) {
    case 'meta':
      el.classList.add('event-meta');
      el.innerHTML = `<span class="turn-badge">turn: ${escapeHtml(data.turn_id)}</span> conv: ${escapeHtml(data.conversation_id)}`;
      break;
    case 'thought':
      body.className = 'thought-content';
      body.textContent = data.content;
      el.appendChild(body);
      break;
    case 'plan':
      body.innerHTML = '<ol>' + data.steps.map(s => `<li>${escapeHtml(s)}</li>`).join('') + '</ol>';
      el.appendChild(body);
      break;
    case 'action':
      body.innerHTML = `<div class="tool-result-summary"><span class="tool-name">${escapeHtml(data.tool_name)}</span></div>` +
        (data.rationale ? `<div style="opacity:0.7;margin-top:6px;font-size:13px">${escapeHtml(data.rationale)}</div>` : '') +
        createCollapsibleJson('参数', JSON.stringify(data.arguments, null, 2));
      el.appendChild(body);
      break;
    case 'observation':
      body.innerHTML = `<div class="tool-result-summary"><span class="tool-name">${escapeHtml(data.tool_name)}</span>` +
        (data.error ? ' <span style="color:var(--danger)">error</span>' : ' <span style="color:var(--success)">ok</span>') +
        '</div>' +
        (data.error ? `<div style="color:var(--danger);margin-top:6px">${escapeHtml(data.error)}</div>` :
         createCollapsibleJson('结果', JSON.stringify(data.result, null, 2)));
      el.appendChild(body);
      break;
    case 'approval_required':
      body.innerHTML = `
        <div><b style="color:var(--warning)">需要确认</b> · 风险等级：<code style="background:var(--surface-2);padding:2px 6px;border-radius:4px">${escapeHtml(data.risk_level)}</code></div>
        <div style="margin-top:8px;font-size:13px"><b>工具：</b><span style="font-family:monospace;color:var(--info)">${escapeHtml(data.tool_name)}</span></div>
        <div style="margin-top:6px"><b style="font-size:13px">参数：</b></div>
        ${createCollapsibleJson('参数', JSON.stringify(data.arguments, null, 2))}
        ${data.rationale ? `<div style="margin-top:8px;opacity:0.8;font-size:13px">${escapeHtml(data.rationale)}</div>` : ''}
        <div class="approval-buttons" id="approve-${escapeAttr(data.turn_id)}">
          <button class="btn-approve" onclick="approveTurn('${escapeAttr(data.turn_id)}', this, true)">批准</button>
          <button class="btn-reject" onclick="approveTurn('${escapeAttr(data.turn_id)}', this, false)">拒绝</button>
        </div>`;
      el.appendChild(body);
      break;
    case 'approval_result':
      body.innerHTML = `<b>${data.decision === 'approved' ? '✓ 已批准' : '✗ 已拒绝'}</b>` +
        (data.reason ? ` — ${escapeHtml(data.reason)}` : '');
      el.appendChild(body);
      break;
    case 'error':
      body.innerHTML = `<b>${escapeHtml(data.code || 'error')}</b>: ${escapeHtml(data.message)}`;
      el.appendChild(body);
      break;
    case 'done':
      el.classList.add('event-done');
      el.textContent = `turn 结束 · 状态：${data.status}`;
      break;
    default:
      body.textContent = JSON.stringify(data);
      el.appendChild(body);
  }

  if (type !== 'meta' && type !== 'done') {
    eventsEl.appendChild(el);
  } else {
    eventsEl.appendChild(el);
  }
  autoScroll();
}

function startStreaming() {
  const el = document.createElement('div');
  el.className = 'event event-final_answer';

  const label = document.createElement('div');
  label.className = 'label';
  label.innerHTML = `<span class="icon">${ICONS.final_answer}</span>assistant`;
  el.appendChild(label);

  const body = document.createElement('div');
  body.className = 'assistant-text';
  body.innerHTML = '<span class="cursor"></span>';
  el.appendChild(body);

  eventsEl.appendChild(el);
  autoScroll();

  streamingEl = body;
  streamingContent = '';
}

function appendStreamDelta(delta) {
  if (!streamingEl) return;
  streamingContent += delta;
  streamingEl.innerHTML = escapeHtml(streamingContent).replace(/\n/g, '<br>') + '<span class="cursor"></span>';
  autoScroll();
}

function finalizeStreaming(text) {
  if (streamingEl) {
    streamingEl.innerHTML = escapeHtml(text).replace(/\n/g, '<br>');
    streamingEl = null;
    streamingContent = '';
    autoScroll();
  } else {
    createFinalAnswerBubble(text);
  }
}

function createFinalAnswerBubble(text) {
  const el = document.createElement('div');
  el.className = 'event event-final_answer';

  const label = document.createElement('div');
  label.className = 'label';
  label.innerHTML = `<span class="icon">${ICONS.final_answer}</span>assistant`;
  el.appendChild(label);

  const body = document.createElement('div');
  body.className = 'assistant-text';
  body.textContent = '';
  el.appendChild(body);

  eventsEl.appendChild(el);
  autoScroll();

  streamingEl = body;
  streamingContent = '';

  const fullText = text;
  let i = 0;
  function typeNext() {
    if (i >= fullText.length) {
      streamingEl.innerHTML = escapeHtml(fullText).replace(/\n/g, '<br>');
      streamingEl = null;
      return;
    }
    const chars = Math.min(2, fullText.length - i);
    i += chars;
    streamingContent = fullText.slice(0, i);
    streamingEl.innerHTML = escapeHtml(streamingContent).replace(/\n/g, '<br>') + '<span class="cursor"></span>';
    autoScroll();
    setTimeout(typeNext, 20);
  }
  typeNext();
}

function escapeHtml(s) {
  if (s == null) return '';
  return String(s).replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}
function escapeAttr(s) { return escapeHtml(s); }

async function sendMessage() {
  const msg = inputEl.value.trim();
  if (!msg || busy) return;
  inputEl.value = '';
  setBusy(true);

  const userEvent = document.createElement('div');
  userEvent.className = 'event event-final_answer';
  userEvent.style.background = 'linear-gradient(135deg, rgba(167,139,250,0.12), rgba(79,140,255,0.08))';
  userEvent.style.borderColor = 'rgba(167,139,250,0.25)';
  const label = document.createElement('div');
  label.className = 'label';
  label.innerHTML = '<span class="icon">👤</span>you';
  userEvent.appendChild(label);
  const body = document.createElement('div');
  body.className = 'assistant-text';
  body.textContent = msg;
  userEvent.appendChild(body);
  eventsEl.appendChild(userEvent);
  autoScroll();

  try {
    const resp = await fetch('/chat', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({message: msg, conversation_id: 'default'}),
    });
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);

    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';

    while (true) {
      const {done, value} = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, {stream: true});
      const events = buffer.split('\n\n');
      buffer = events.pop();
      for (const block of events) {
        const lines = block.split('\n');
        let type = 'message', data = '';
        for (const line of lines) {
          if (line.startsWith('event: ')) type = line.slice(7);
          else if (line.startsWith('data: ')) data += line.slice(6);
        }
        if (!data) continue;
        try {
          const parsed = JSON.parse(data);
          appendEvent(type, parsed);
        } catch (e) {
          appendEvent('error', {code: 'parse', message: data});
        }
      }
    }
  } catch (e) {
    appendEvent('error', {code: 'network', message: e.message});
  } finally {
    if (streamingEl) {
      streamingEl.innerHTML = escapeHtml(streamingContent).replace(/\n/g, '<br>');
      streamingEl = null;
    }
    setBusy(false);
    inputEl.focus();
  }
}

async function approveTurn(turnId, btnEl, decision) {
  const btnContainer = btnEl.closest('.approval-buttons');
  if (btnContainer) {
    const buttons = btnContainer.querySelectorAll('button');
    buttons.forEach(b => { b.disabled = true; b.style.opacity = '0.5'; b.style.pointerEvents = 'none'; });
  }
  try {
    const resp = await fetch('/approve', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({turn_id: turnId, decision: decision, reason: ''}),
    });
    if (!resp.ok) {
      const err = await resp.json();
      alert('批准失败：' + (err.detail || resp.status));
      if (btnContainer) {
        const buttons = btnContainer.querySelectorAll('button');
        buttons.forEach(b => { b.disabled = false; b.style.opacity = ''; b.style.pointerEvents = ''; });
      }
    }
  } catch (e) {
    alert('网络错误：' + e.message);
    if (btnContainer) {
      const buttons = btnContainer.querySelectorAll('button');
      buttons.forEach(b => { b.disabled = false; b.style.opacity = ''; b.style.pointerEvents = ''; });
    }
  }
}

async function resetConversation() {
  if (!confirm('确认清空当前会话记忆？')) return;
  await fetch('/reset', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({conversation_id: 'default'}),
  });
  eventsEl.innerHTML = '';
  streamingEl = null;
  streamingContent = '';
  appendEvent('meta', {turn_id: '-', conversation_id: 'default', user_input: '(会话已重置)'});
}

inputEl.focus();
</script>
