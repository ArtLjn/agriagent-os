[project]
name = "farm-manager-agent"
version = "0.1.0"
description = "farm-manager agent: ReAct loop + MCP client + SSE + HITL"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=3.4",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "openai>=1.40",
    "pydantic>=2.7",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "motor>=3.3",         # MongoDB async driver for chat history
    "redis>=5.0",         # Redis async client for Agent coordination
    "pyyaml>=6.0",        # config.yaml loader
    "pyjwt>=2.8",         # JWT 解析（从 Bearer token 提取 user_id / farm_id）
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent"]

# Run: uv run --package farm-manager-agent python -m agent.main
