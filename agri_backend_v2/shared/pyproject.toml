[project]
name = "farm-manager-shared"
version = "2.0.0"
description = "Shared roles, API response and location data for v2 services"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["shared"]
