# Agent 服务配置模板（不含真实密钥）。
# 复制为 config.yaml 后填入真实值。

environment: "development"
max_parallel_skills: 4

server:
  host: "127.0.0.1"
  port: 8000

redis:
  enabled: false
  host: "127.0.0.1"
  port: 6379
  username: ""
  password: ""
  database: 0
  connect_timeout_ms: 2000
  socket_timeout_ms: 2000
  max_connections: 50
  key_prefix: "fm:agri_backend_v2:agent:dev"
  global_active_limit: 8
  user_active_limit: 2
  conversation_lock_ttl_ms: 30000
  conversation_lock_renew_ms: 10000
  conversation_queue_limit: 2
  global_queue_limit: 32
  queue_wait_timeout_seconds: 30
  turn_execution_timeout_seconds: 120
  event_stream_maxlen: 1000
  turn_state_ttl_seconds: 86400
  approval_ttl_seconds: 600
  idempotency_ttl_seconds: 86400
  cleanup_interval_seconds: 30
  dispatch_stream_ttl_seconds: 86400
  worker_count: 2
  dispatch_stream: "turn:dispatch"
  dispatch_group: "agent-workers"

mongodb:
  enabled: true
  uri: "mongodb://USER:PASSWORD@HOST:27017/?authSource=admin"
  database: "farm_manager"
  tls: false
  connect_timeout_ms: 2000
  server_selection_timeout_ms: 2000
  max_pool_size: 20
  collections:
    conversation_messages: "conversationMessages"
    trace_records: "traceRecords"
    trace_request_summaries: "traceRequestSummaries"
    trace_events: "traceEvents"

# Session/Short Memory/Context 迁移配置。
# conversation_state_v2 与 memory_mongo_read 默认关闭，打开前先完成 shadow-read 验收。
context:
  conversation_state:
    collection: "conversationStates"
    summary_ttl_seconds: 86400
    recent_turn_limit: 6
  summary_soft_ratio: 0.60
  summary_hard_ratio: 0.80
  response_reserve_tokens: 4096
  safety_margin_tokens: 1024
  max_tool_result_summary_chars: 1200
  tool_schema_mode: "all"
  feature_flags:
    context_bundle_v2: false
    conversation_state_v2: false
    summary_cas: false
    memory_mongo_read: false
    candidate_tool_schema: false
    long_term_memory_observation: false

ai:
  model: "qwen3.6-35b-a3b"
  api_key: ""
  base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
  enable_thinking: false
  parallel_tool_calls: true

business_mcp:
  url: "http://127.0.0.1:9876/mcp"
  api_url: "http://127.0.0.1:9876/api/v2"

auth:
  # 与 business 共享同一个 JWT secret，用于解析前端 Bearer token 中的 sub / farm_uid
  jwt_secret: ""
  jwt_algorithm: "HS256"
  jwt_issuer: "farm-manager-auth"
  jwt_audience: "farm-manager-agent"
  # Agent 调用 Business MCP 的服务凭证（当前为轮换型 opaque token）
  agent_service_token: ""
  # Agent 为每个 turn 签发的短时用户委托凭证密钥
  delegation_secret: ""
  delegation_issuer: "farm-manager-agent"
  delegation_audience: "farm-manager-business-mcp"
