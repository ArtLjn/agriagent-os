openapi: 3.1.0
info:
  title: Business 备忘录 API
  description: 备忘录模块接口；完整业务接口以运行服务 /openapi.json 为准。所有请求需要 Bearer JWT。
  version: 2.0.0
paths:
  /api/v2/memos:
    get:
      tags:
      - memos
      summary: List Memos
      description: 搜索自己的备忘录，身份不得由请求参数覆盖。
      operationId: list_memos_api_v2_memos_get
      parameters:
      - name: keyword
        in: query
        required: false
        schema:
          type: string
          maxLength: 200
          default: ''
          title: Keyword
      - name: archived
        in: query
        required: false
        schema:
          type: boolean
          default: false
          title: Archived
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 20
          title: Limit
      - name: skip
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
          title: Skip
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '503':
          description: 备忘录表未初始化或存储暂不可用；detail.code 为 memo_schema_not_ready 或 memo_storage_unavailable，meta.operation 标明当前操作，不包含 SQL 或用户内容。
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response List Memos Api V2 Memos Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - memos
      summary: Create Memo
      description: 创建备忘录，重复请求返回既有记录。
      operationId: create_memo_api_v2_memos_post
      parameters:
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemoCreate'
      responses:
        '503':
          description: 备忘录表未初始化或存储暂不可用；detail.code 为 memo_schema_not_ready 或 memo_storage_unavailable，meta.operation 标明当前操作，不包含 SQL 或用户内容。
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Create Memo Api V2 Memos Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v2/memos/{memo_id}:
    patch:
      tags:
      - memos
      summary: Update Memo
      description: 编辑、置顶、归档或恢复自己的备忘录。
      operationId: update_memo_api_v2_memos__memo_id__patch
      parameters:
      - name: memo_id
        in: path
        required: true
        schema:
          type: integer
          title: Memo Id
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemoUpdate'
      responses:
        '503':
          description: 备忘录表未初始化或存储暂不可用；detail.code 为 memo_schema_not_ready 或 memo_storage_unavailable，meta.operation 标明当前操作，不包含 SQL 或用户内容。
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Update Memo Api V2 Memos  Memo Id  Patch
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v2/admin/prompts:
    get:
      summary: List Admin Prompts
      description: 返回运行时缓存中的模板，避免将磁盘内容误报为当前生效内容。
      operationId: list_admin_prompts_api_v2_admin_prompts_get
      parameters:
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v2/admin/prompts/reload:
    post:
      summary: Reload Admin Prompts
      description: 重新读取当前进程的模板；不承诺更新已启动对话或其他工作进程。
      operationId: reload_admin_prompts_api_v2_admin_prompts_reload_post
      parameters:
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v2/admin/stats/tokens:
    get:
      summary: Summary
      description: 返回最近 N 个北京时间自然日的模型用量。
      operationId: summary_api_v2_admin_stats_tokens_get
      parameters:
      - name: days
        in: query
        required: false
        schema:
          type: integer
          maximum: 93
          minimum: 1
          default: 7
          title: Days
      - name: user_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: User Id
      - name: model
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Model
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v2/admin/stats/tokens/daily:
    get:
      summary: Daily
      description: 按模型汇总指定自然日，保持页面现有契约。
      operationId: daily_api_v2_admin_stats_tokens_daily_get
      parameters:
      - name: date
        in: query
        required: true
        schema:
          type: string
          format: date
          title: Date
      - name: user_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: User Id
      - name: model
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Model
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v2/admin/stats/tokens/hourly:
    get:
      summary: Hourly
      description: 返回日期、小时、用户、模型四个维度的统计。
      operationId: hourly_api_v2_admin_stats_tokens_hourly_get
      parameters:
      - name: start_date
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: Start Date
      - name: end_date
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: End Date
      - name: user_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: User Id
      - name: model
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Model
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    MemoCreate:
      properties:
        title:
          type: string
          maxLength: 200
          minLength: 1
          title: Title
        content:
          type: string
          maxLength: 10000
          minLength: 1
          title: Content
        pinned:
          type: boolean
          title: Pinned
          default: false
        client_request_id:
          type: string
          maxLength: 100
          minLength: 1
          title: Client Request Id
      additionalProperties: false
      type: object
      required:
      - title
      - content
      - client_request_id
      title: MemoCreate
    MemoUpdate:
      properties:
        title:
          anyOf:
          - type: string
            maxLength: 200
            minLength: 1
          - type: 'null'
          title: Title
        content:
          anyOf:
          - type: string
            maxLength: 10000
            minLength: 1
          - type: 'null'
          title: Content
        pinned:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Pinned
        archived:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Archived
      additionalProperties: false
      type: object
      title: MemoUpdate
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
