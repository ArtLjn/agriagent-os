openapi: 3.1.0
x-stream-events:
  memory_context:
    visibility: admin_debug
    description: Runtime 在开始检索、准备完成和最终请求预算裁剪后发布；普通用户投影不携带记忆正文。Redis 事件与 Trace 使用同一份最终证据。
    stages: [start, prepared, complete]
    fields:
      retrieval: 实际 query、配置状态、集合、词项和语义命中数、融合数量、有界候选原文、版本与排名；不包含凭据。
      prepared_count: 进入最终请求预算之前准备的事实数。
      injected_count: 最终完整记忆块的事实数；块被修改且无法确定数量时为 null，缺少记忆块时为零。
      injection: status、chars、text、truncated；文本来自实际请求，最多展示 4000 字符，不代表模型已经理解或使用。
    injection_statuses: [included, modified, budget_omitted, not_in_request, not_prepared]
info:
  title: Business 与 Agent 增量接口
  description: 备忘录、管理监控与个性化推荐接口；完整接口以对应运行服务 /openapi.json 为准。所有请求需要 Bearer JWT。
  version: 2.0.0
paths:
  /api/v2/conversations:
    get:
      summary: 分页读取当前用户和农场的会话或草稿箱
      description: 需要 conversation:read。默认返回未归档会话，始终排除已删除会话；旧数据视为未归档。
      parameters:
      - {name: archived, in: query, schema: {type: boolean, default: false}}
      - {name: limit, in: query, schema: {type: integer, default: 20, minimum: 1, maximum: 100}}
      - {name: cursor, in: query, schema: {type: string}}
      responses:
        '200':
          description: items 包含 conversation_id、last_message、last_role、last_at、message_count、archived；返回 next_cursor 与 has_more。
        '503':
          description: conversation_storage_unavailable；存储故障不伪装为空列表。
  /api/v2/conversations/{conversation_id}:
    parameters:
    - {name: conversation_id, in: path, required: true, schema: {type: string}}
    patch:
      summary: 归档到草稿箱或恢复会话
      description: 需要 conversation:write，身份与农场仅来自 JWT。归档保留消息，恢复后可继续聊天。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [archived]
              properties:
                archived: {type: boolean}
      responses:
        '200':
          description: 返回 conversation_id、archived。
        '404':
          description: 会话不存在、属于其他租户或已删除。
        '409':
          description: conversation_state_changed；并发删除后不能恢复。
        '422':
          description: 拒绝非布尔值及额外字段。
        '503':
          description: 会话存储暂不可用。
    delete:
      summary: 从草稿箱不可恢复地逻辑删除会话
      description: 需要 conversation:write，必须先归档。保留删除标记防止迟到写入使会话重新出现；不清除已保存的个性化记忆或审计证据。删除后会话详情、消息、Turn 接口和新聊天均拒绝访问。
      responses:
        '200':
          description: 返回 conversation_id 与 deleted=true；重复删除幂等成功。
        '404':
          description: 会话不存在或属于其他租户。
        '409':
          description: conversation_not_archived 或 conversation_state_changed。
        '503':
          description: 会话存储暂不可用。
  /api/v2/me/memory-learning/{turn_id}:
    get:
      summary: 查询当前用户某一轮的后台记忆学习状态
      description: 按 JWT 用户及农场隔离，只返回状态与提交数量；聊天 SSE 结束后仍可查询。响应 Cache-Control 为 no-store。queued/pending/running 不代表记忆已保存。
      parameters:
      - name: turn_id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 128
      responses:
        '200':
          description: done 且 applied_count 大于零才表示该次学习实际提交了记忆；not_observed 不暴露其他账号是否存在同名任务。
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [not_observed, pending, queued, running, done, failed, disabled, temporary, sensitive, input_too_long, control_changed, unavailable]
                  applied_count:
                    type: integer
                    minimum: 0
                  reason:
                    type: [string, 'null']
                  code:
                    type: [string, 'null']
                required: [status]
  /api/v2/health:
    get:
      summary: Agent 运行状态与启动版本
      description: runtime.started_at 为启动时间戳；runtime.memory_build 为启动时记忆模块源码 SHA256 前 16 位。磁盘修改不会改变运行进程的指纹。
      responses:
        '200':
          description: 包含依赖状态、active_turns、pending_approvals 和 runtime。
          content:
            application/json:
              schema:
                type: object
                properties:
                  runtime:
                    type: object
                    properties:
                      started_at:
                        type: number
                      memory_build:
                        type: string
                      memory_mode:
                        type: string
                        enum: [retrieve, read]
                      memory_semantic_configured:
                        type: boolean
                        description: 仅表示语义服务配置存在，可用性以实际检索诊断为准。
                      skill_router_mode:
                        type: string
                        enum: [main_agent, llm_router]
  /api/v2/memos:
    get:
      tags:
      - memos
      summary: List Memos
      description: 搜索自己的备忘录，身份不得由请求参数覆盖。
      operationId: list_memos_api_v2_memos_get
      parameters:
      - name: keyword
        in: query
        required: false
        schema:
          type: string
          maxLength: 200
          default: ''
          title: Keyword
      - name: archived
        in: query
        required: false
        schema:
          type: boolean
          default: false
          title: Archived
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 20
          title: Limit
      - name: skip
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
          title: Skip
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '503':
          description: 备忘录表未初始化或存储暂不可用；detail.code 为 memo_schema_not_ready 或 memo_storage_unavailable，meta.operation 标明当前操作，不包含 SQL 或用户内容。
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response List Memos Api V2 Memos Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - memos
      summary: Create Memo
      description: 创建备忘录，重复请求返回既有记录。
      operationId: create_memo_api_v2_memos_post
      parameters:
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemoCreate'
      responses:
        '503':
          description: 备忘录表未初始化或存储暂不可用；detail.code 为 memo_schema_not_ready 或 memo_storage_unavailable，meta.operation 标明当前操作，不包含 SQL 或用户内容。
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Create Memo Api V2 Memos Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v2/memos/{memo_id}:
    patch:
      tags:
      - memos
      summary: Update Memo
      description: 编辑、置顶、归档或恢复自己的备忘录。
      operationId: update_memo_api_v2_memos__memo_id__patch
      parameters:
      - name: memo_id
        in: path
        required: true
        schema:
          type: integer
          title: Memo Id
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemoUpdate'
      responses:
        '503':
          description: 备忘录表未初始化或存储暂不可用；detail.code 为 memo_schema_not_ready 或 memo_storage_unavailable，meta.operation 标明当前操作，不包含 SQL 或用户内容。
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Update Memo Api V2 Memos  Memo Id  Patch
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v2/admin/businesses:
    get:
      summary: List Admin Businesses
      description: 返回 businesses 目录下已安装业务的清单状态和当前进程启用的业务。需要 admin:debug；单个清单异常以 error_code 返回，不返回绝对路径。
      operationId: list_admin_businesses_api_v2_admin_businesses_get
      parameters:
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          description: items 包含 name、display_name、description、skill_count、error_code；active 为当前启用业务，total 为条目数。
          content:
            application/json:
              schema:
                type: object
                properties:
                  active:
                    type: [string, 'null']
                  total:
                    type: integer
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                        display_name:
                          type: [string, 'null']
                        description:
                          type: [string, 'null']
                        skill_count:
                          type: integer
                        error_code:
                          type: [string, 'null']
        '401':
          description: missing_authorization
        '403':
          description: permission_denied
        '503':
          description: business_catalog_unavailable；业务根目录缺失或不可读。
  /api/v2/admin/businesses/active:
    put:
      summary: Switch Active Business
      description: 在当前 Agent 进程内切换业务插件，立即加载目标业务的 system prompt 与技能；重启后恢复部署配置。仅对当前运行进程生效。
      operationId: switch_admin_business_api_v2_admin_businesses_active_put
      parameters:
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name:
                  type: string
                  pattern: '^[a-z][a-z0-9-]*$'
                  maxLength: 64
      responses:
        '200':
          description: active 为新启用业务，display_name 为展示名，skill_count 为技能目录数。
          content:
            application/json:
              schema:
                type: object
                properties:
                  active:
                    type: string
                  display_name:
                    type: string
                  skill_count:
                    type: integer
        '401':
          description: missing_authorization
        '403':
          description: permission_denied
        '404':
          description: business_not_found
        '409':
          description: business_manifest_invalid
        '422':
          description: business_skills_invalid 或 business_prompt_invalid
  /api/v2/admin/prompts:
    get:
      summary: List Admin Prompts
      description: 返回运行时缓存中的模板；传 business 时只读预览该业务的 system prompt。平台提示词始终返回，预览不会改变运行时提示词。
      operationId: list_admin_prompts_api_v2_admin_prompts_get
      parameters:
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      - name: business
        in: query
        required: false
        description: 业务目录名；省略时使用当前启用业务。
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Business
      responses:
        '200':
          description: items 包含 name、version、active、content、scope（platform/business）和 business；顶层返回 business 与 active_business。
          content:
            application/json:
              schema:
                type: object
                properties:
                  business:
                    type: [string, 'null']
                  active_business:
                    type: [string, 'null']
                  total:
                    type: integer
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                        version:
                          type: string
                        active:
                          type: boolean
                        content:
                          type: string
                        content_length:
                          type: integer
                        source:
                          type: string
                        scope:
                          type: string
                          enum: [platform, business]
                        business:
                          type: [string, 'null']
        '404':
          description: business_not_found
        '409':
          description: business_manifest_invalid
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '503':
          description: business_catalog_unavailable 或 prompt_unavailable
  /api/v2/admin/prompts/reload:
    post:
      summary: Reload Admin Prompts
      description: 重新读取当前启用业务的模板；不承诺更新已启动对话或其他工作进程。非启用业务只读预览，不能重载。
      operationId: reload_admin_prompts_api_v2_admin_prompts_reload_post
      parameters:
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      - name: business
        in: query
        required: false
        description: 业务目录名；必须等于当前启用业务。
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Business
      responses:
        '200':
          description: 当前进程缓存已清空，新建上下文时生效。
        '404':
          description: business_not_found
        '409':
          description: business_not_active 或 business_manifest_invalid
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v2/admin/stats/tokens:
    get:
      summary: Summary
      description: 返回最近 N 个北京时间自然日的模型用量。
      operationId: summary_api_v2_admin_stats_tokens_get
      parameters:
      - name: days
        in: query
        required: false
        schema:
          type: integer
          maximum: 93
          minimum: 1
          default: 7
          title: Days
      - name: user_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: User Id
      - name: model
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Model
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v2/admin/stats/tokens/daily:
    get:
      summary: Daily
      description: 按模型汇总指定自然日，保持页面现有契约。
      operationId: daily_api_v2_admin_stats_tokens_daily_get
      parameters:
      - name: date
        in: query
        required: true
        schema:
          type: string
          format: date
          title: Date
      - name: user_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: User Id
      - name: model
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Model
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v2/admin/stats/tokens/hourly:
    get:
      summary: Hourly
      description: 返回日期、小时、用户、模型四个维度的统计。
      operationId: hourly_api_v2_admin_stats_tokens_hourly_get
      parameters:
      - name: start_date
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: Start Date
      - name: end_date
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: End Date
      - name: user_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: User Id
      - name: model
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Model
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v2/me/question-recommendations:
    post:
      summary: Question Recommendations
      description: 按 JWT 当前用户推荐；不允许请求体指定用户或农场身份。
      operationId: question_recommendations_api_v2_me_question_recommendations_post
      parameters:
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecommendationRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecommendationResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v2/me/personalization:
    get:
      summary: Get Settings
      operationId: get_settings_api_v2_me_personalization_get
      parameters:
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      - name: business
        in: query
        required: false
        description: 业务目录名；省略时使用当前启用业务。
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Business
      responses:
        '200':
          description: 称呼、助手名称、表达方式、详细程度、自定义指令和展示开关按业务解析；记忆开关与长期记忆全局共享；business 返回解析到的业务。
          content:
            application/json:
              schema: {}
        '404':
          description: business_not_found
        '409':
          description: business_manifest_invalid
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      description: 自动学习默认开启；旧文档未显式选择时采用新默认，用户明确关闭仍保留。读取不执行迁移写入。
    patch:
      summary: Patch Settings
      operationId: patch_settings_api_v2_me_personalization_patch
      parameters:
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      - name: business
        in: query
        required: false
        description: 业务目录名；助手设置写入该业务的 profile，记忆开关仍写入用户全局设置。
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Business
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SettingsPatch'
      responses:
        '200':
          description: 返回合并业务 profile 后的设置。
          content:
            application/json:
              schema: {}
        '404':
          description: business_not_found
        '409':
          description: business_manifest_invalid
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v2/me/memories:
    get:
      summary: List Memories
      description: >-
        按认证用户和农场隔离，支持 category 分类筛选；旧记录缺省 general。
        自动学习的新记录直接 active，无需逐条确认。返回主题卡片及可选 atoms 原子事实，旧记录首次涉及更新时无损拆分。
        atoms 包含 slot、text、source_type、source_message_ids、evidence_turns、evidence_count、revision、valid_from、last_observed_at、updated_at。
        atoms 还可包含 conditions、temporal_scope、time_evidence、state、history（最多5个旧版本）和 alternatives（最多3个冲突备选）；conflicted 不表示已确认事实。
        支持独立正文存储的数据库分页，过期筛选按有效期投影，最多10000条有效卡片。
        删除清除正文、atoms 的当前值、历史与冲突备选和来源，保留重试屏障。实际自学习写入由后台任务 applied_count 表示。
      operationId: list_memories_api_v2_me_memories_get
      parameters:
      - name: page
        in: query
