[project]
name = "farm-manager-business"
version = "2.0.0"
description = "farm-manager business service exposed as MCP Server"
requires-python = ">=3.11"
dependencies = [
    "farm-manager-shared",
    "fastapi>=0.115",
    "fastmcp>=3.4",
    "httpx>=0.27",
    "sqlalchemy>=2.0",
    "pymysql>=1.1",
    "pyyaml>=6.0",
    "bcrypt>=5.0.0",
    "pyjwt>=2.8",
    "uvicorn>=0.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["farm_business"]

[tool.uv.sources]
farm-manager-shared = { workspace = true }

# Run: uv run --package farm-manager-business python -m farm_business.server
